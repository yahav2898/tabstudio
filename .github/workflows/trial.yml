name: Repository trial

# Iteration only (trial/** branches): the unit tests the real-repository work touches and the real repositories.
on:
  push:
    branches: ['trial/**']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  DOTNET_MODIFIABLE_ASSEMBLIES: debug

jobs:
  units:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test
        run: |
          mkdir -p ci-out
          status=0
          for p in TabStudio.Core.Tests TabStudio.Compilation.Tests TabStudio.Packages.Tests TabStudio.Toolchains.Tests; do
            dotnet test tests/$p -c Release -p:TreatWarningsAsErrors=true --logger "console;verbosity=normal" > ci-out/$p.log 2>&1 || status=1
            grep -E "error |Failed |Passed!|Failed!|Total tests" ci-out/$p.log | head -60
          done
          dotnet build src/TabStudio.Desktop -c Release -p:TreatWarningsAsErrors=true > ci-out/desktop-build.log 2>&1 || status=1
          grep -E " error |Build succeeded|Warn|Error" ci-out/desktop-build.log | head -40
          exit $status
      - name: Publish
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/ci/publish-logs.sh units ${{ job.status }}

  real-repos:
    name: Real repositories
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Clone the pinned repositories
        run: python3 build/ci/real-repos.py "$RUNNER_TEMP/real-repos"
      - name: Open and build them in TabStudio
        env:
          TABSTUDIO_REAL_REPOS: ${{ runner.temp }}/real-repos
          TABSTUDIO_REAL_REPOS_OUT: ${{ github.workspace }}/ci-out
          TABSTUDIO_SCREENSHOTS: ${{ github.workspace }}/ci-out/screenshots
        run: |
          mkdir -p ci-out/screenshots
          status=0
          dotnet test tests/TabStudio.App.Tests -c Release --blame-hang-timeout 30m --blame-hang-dump-type none \
            --filter "FullyQualifiedName~RealRepositoryTests" --logger "console;verbosity=normal" > ci-out/test.log 2>&1 || status=$?
          tail -n 40 ci-out/test.log; cat ci-out/summary.md 2>/dev/null || true
          exit "$status"
      - name: Publish
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/ci/publish-logs.sh real-repos ${{ job.status }}
