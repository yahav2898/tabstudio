name: Repository trial

# Opens public repositories in the IDE and builds them, as a person would on the tablet. Runs only for trial/**
# branches and publishes its reports and screenshots to ci-logs under branches/<branch>/trial/.
on:
  push:
    branches: ['trial/**']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  trial:
    name: Open real repositories
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Clone the repositories
        run: |
          mkdir -p "$RUNNER_TEMP/repos"
          for repo in simplcommerce/SimplCommerce piranhacms/piranha.core; do
            git clone --depth 1 "https://github.com/$repo" "$RUNNER_TEMP/repos/${repo#*/}"
          done

      - name: Open and build them in TabStudio
        env:
          TABSTUDIO_TRIAL_REPOS: ${{ runner.temp }}/repos/SimplCommerce;${{ runner.temp }}/repos/piranha.core
          TABSTUDIO_TRIAL_OUT: ${{ github.workspace }}/ci-out
          TABSTUDIO_SCREENSHOTS: ${{ github.workspace }}/ci-out/screenshots
        run: |
          mkdir -p ci-out/screenshots
          dotnet test tests/TabStudio.App.Tests -c Release --filter "FullyQualifiedName~RepoTrialTests" > ci-out/test.log 2>&1 || true
          tail -5 ci-out/test.log

      - name: Publish the reports
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/ci/publish-logs.sh trial ${{ job.status }}
