name: Repository trial

# Opens public repositories in the IDE and builds them, as a person would on the tablet. Runs only for trial/**
# branches and publishes its reports and screenshots to ci-logs under branches/<branch>/trial-<area>/.
# The repositories, pinned to commits, are build/ci/trial-sweep.json; each area runs as its own job.
on:
  push:
    branches: ['trial/**']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  trial:
    name: Open real repositories (${{ matrix.area }})
    # A trial/*embedded branch runs only the embedded job below.
    if: ${{ !endsWith(github.ref_name, 'embedded') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    # The databases the apps' READMEs ask for: on a tablet, TabStudio's Services or a server on the network.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: tabstudio-ci
          POSTGRES_DB: realworld
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: tabstudio-ci
          MYSQL_DATABASE: nestjsrealworld
        ports: [3306:3306]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptabstudio-ci" --health-interval 5s --health-timeout 5s --health-retries 30
    strategy:
      fail-fast: false
      matrix:
        area: [dotnet-web, dotnet-lib, dotnet-desktop, python, node-apps, node-libs, go, rust, c-cpp, java, kotlin-android, php, swift, dart]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The toolchains these repositories set up with, as the Toolchain Store installs them on a tablet (CMake, make and
      # GCC are on the runner already).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install Maven
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y maven
          mvn -v; cargo --version; uv --version; node --version; go version; cmake --version | head -1

      # The C and C++ repositories' own build prerequisites: autotools for jq, X11 and OpenGL headers for raylib.
      - name: Install autotools and X11 headers
        if: matrix.area == 'c-cpp'
        run: sudo apt-get install -y -qq autoconf automake libtool libonig-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev > /dev/null

      - uses: shivammathur/setup-php@v2
        if: matrix.area == 'php'
        with:
          php-version: '8.5'
          extensions: mbstring, intl, bcmath, gd, pdo_mysql, pdo_pgsql, pdo_sqlite, sqlite3, zip
          tools: composer
          coverage: none

      - name: Install Kotlin, Gradle and Swift
        if: matrix.area == 'kotlin-android' || matrix.area == 'swift' || matrix.area == 'java'
        timeout-minutes: 15
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.4-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "f1771298a70f6db5a29daf62378c4e18a17fc33c9ba6b14362e0cdf40610380d  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.14.4/bin" >> "$GITHUB_PATH"
          curl -fsSL https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip -o "$RUNNER_TEMP/kotlinc.zip"
          echo "7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd  $RUNNER_TEMP/kotlinc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/kotlinc.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
          if [ "${{ matrix.area }}" = swift ]; then
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libz3-dev libncurses-dev libedit2 libpython3-dev > /dev/null
            curl -fsSL https://download.swift.org/swift-6.4.1-release/ubuntu2404/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE-ubuntu24.04.tar.gz -o "$RUNNER_TEMP/swift.tar.gz"
            echo "7d246c7114077ad01dba4ad897628446ada4c489d6c7dbcf39ae3f25cbe17e8b  $RUNNER_TEMP/swift.tar.gz" | sha256sum -c -
            mkdir -p "$RUNNER_TEMP/swift"
            tar -xzf "$RUNNER_TEMP/swift.tar.gz" -C "$RUNNER_TEMP/swift" --strip-components=1
            echo "$RUNNER_TEMP/swift/usr/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Flutter and Dart
        if: matrix.area == 'dart'
        run: bash build/ci/flutter-sdk-test.sh "$RUNNER_TEMP/flutter-sdk"

      - name: Clone the repositories at their pinned commits
        env:
          AREA: ${{ matrix.area }}
        run: |
          jq -r --arg area "$AREA" '.repositories[] | select(.area == $area) | [.name, .url, .sha] | @tsv' build/ci/trial-sweep.json |
          while IFS=$'\t' read -r name url sha; do
            dir="$RUNNER_TEMP/repos/$name"
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 "$url" "$sha"
            git -C "$dir" -c advice.detachedHead=false checkout -q FETCH_HEAD
            echo "$name: $sha"
          done

      - name: Open, set up, build and run them in TabStudio
        env:
          TABSTUDIO_TRIAL_ROOT: ${{ runner.temp }}/repos
          TABSTUDIO_TRIAL_AREA: ${{ matrix.area }}
          TABSTUDIO_TRIAL_OUT: ${{ github.workspace }}/ci-out
          TABSTUDIO_SCREENSHOTS: ${{ github.workspace }}/ci-out/screenshots
        run: |
          mkdir -p ci-out/screenshots
          dotnet test tests/TabStudio.App.Tests -c Release --filter "FullyQualifiedName~RepoTrialTests" --logger "console;verbosity=normal" > ci-out/test.log 2>&1 || true
          tail -20 ci-out/test.log
          if [ -f ci-out/summary.md ]; then cat ci-out/summary.md | tee -a "$GITHUB_STEP_SUMMARY"; fi

      - name: Publish the reports
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/ci/publish-logs.sh trial-${{ matrix.area }} ${{ job.status }}

  # The embedded repositories, built with their real toolchains by the runner the Embedded firmware workflow's
  # real-repositories job uses, from build/ci/trial-sweep.json instead of real-repos.json.
  embedded:
    name: Embedded trial / ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [arduino-neopixel, arduino-fastled, arduino-json, platformio-esp32, platformio-stm32cube, rust-stm32f4xx-hal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git cmake ninja-build build-essential python3-venv libusb-1.0-0 libffi-dev libssl-dev
      - name: Install Arm cross compiler from signed Ubuntu packages
        if: matrix.project == 'zephyr-synchronization'
        run: sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Install pinned build front ends
        if: startsWith(matrix.project, 'platformio')
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r build/embedded/platformio.requirements.txt
      - name: Compile the pinned public repository
        run: |
          python build/embedded/run-real-repos.py --manifest build/ci/trial-sweep.json --only '${{ matrix.project }}' \
            --work "$RUNNER_TEMP/embedded-repos" --output ci-out/embedded-repos || echo "BUILD FAILED" | tee ci-out/failed.txt
          cat ci-out/embedded-repos/*/summary.json | python3 -c 'import json,sys; s=json.load(sys.stdin); print("passed" if s["passed"] else "FAILED: " + str(s["error"]), "in", s["seconds"], "s")' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish the reports
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-out
          bash build/ci/publish-logs.sh trial-embedded-${{ matrix.project }} ${{ job.status }}
