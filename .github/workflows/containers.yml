name: OCI containers
on:
  # main ran no container checks at all: the workflow ran only on agent/containers and on pull requests.
  push:
    branches: [main, 'agent/**']
    paths:
      - 'src/TabStudio.Containers/**'
      - 'src/TabStudio.Services/**'
      - 'src/TabStudio.App/ViewModels/Services/**'
      - 'src/TabStudio.App/ViewModels/Containers*.cs'
      - 'src/TabStudio.App/Views/ContainersView.axaml*'
      - 'tests/TabStudio.Containers.Tests/**'
      - 'tests/TabStudio.App.Tests/BackingServices/**'
      - 'native/containers/**'
      - 'build/ci/containers-proot.sh'
      - '.github/workflows/containers.yml'
  pull_request:
    paths:
      - 'src/TabStudio.Containers/**'
      - 'src/TabStudio.Services/**'
      - 'src/TabStudio.App/ViewModels/Services/**'
      - 'src/TabStudio.App/ViewModels/Containers*.cs'
      - 'src/TabStudio.App/Views/ContainersView.axaml*'
      - 'tests/TabStudio.Containers.Tests/**'
      - 'tests/TabStudio.App.Tests/BackingServices/**'
      - 'native/containers/**'
      - 'build/ci/containers-proot.sh'
      - '.github/workflows/containers.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: containers-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  containers:
    name: OCI images (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build the shared IDE
        if: matrix.arch == 'x64'
        run: dotnet build src/TabStudio.App -c Release -warnaserror
      - name: Build the same patched PRoot as Android
        run: bash build/ci/containers-proot.sh "$RUNNER_TEMP/containers-proot"
      - name: Registry, layers, Compose and real image processes
        env:
          TABSTUDIO_CONTAINER_REQUIRED: '1'
        run: |
          mkdir -p ci-out
          dotnet test tests/TabStudio.Containers.Tests -c Release -warnaserror --logger 'console;verbosity=detailed' --logger 'trx;LogFileName=containers.trx' > ci-out/containers.log 2>&1 || { cat ci-out/containers.log; exit 1; }
          cat ci-out/containers.log
      - uses: actions/setup-node@v4
        if: matrix.arch == 'x64'
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: matrix.arch == 'x64'
        with:
          python-version: '3.14'
      - uses: actions/checkout@v4
        if: matrix.arch == 'x64'
        with:
          repository: fastapi/full-stack-fastapi-template
          ref: f4bcfaba7c85be3c6332cc74a20819f586dcdbc6
          path: artifacts/container-fastapi
      - uses: oven-sh/setup-bun@v2
        if: matrix.arch == 'x64'
        with:
          bun-version: '1'
      - name: Build pinned FastAPI repository frontend as its development instructions require
        if: matrix.arch == 'x64'
        working-directory: artifacts/container-fastapi
        run: |
          bun install --frozen-lockfile
          bun run --cwd frontend build
      - uses: actions/checkout@v4
        if: matrix.arch == 'x64'
        with:
          repository: gothinkster/node-express-realworld-example-app
          ref: 30b68e1e881462b2f4164ea09ab4c4f5699c7b0b
          path: artifacts/container-trial
      - name: Containers window and pinned repository first route through F5
        if: matrix.arch == 'x64'
        env:
          TABSTUDIO_CONTAINER_TRIAL_REPO: ${{ github.workspace }}/artifacts/container-trial
          TABSTUDIO_CONTAINER_FASTAPI_REPO: ${{ github.workspace }}/artifacts/container-fastapi
          TABSTUDIO_SCREENSHOTS: ${{ github.workspace }}/ci-out/screenshots
          NX_DAEMON: 'false'
        run: |
          dotnet test tests/TabStudio.App.Tests -c Release --filter 'FullyQualifiedName~BackingServices.ContainersTests|FullyQualifiedName~BackingServices.ContainerRepositoryTests' --logger 'console;verbosity=normal' > ci-out/containers-ide.log 2>&1 || { cat ci-out/containers-ide.log; exit 1; }
          cat ci-out/containers-ide.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: containers-${{ github.event_name }}-${{ matrix.arch }}
          path: |
            ci-out/
            screenshots/
            tests/TabStudio.Containers.Tests/TestResults/
            ${{ runner.temp }}/containers-proot/*log

  # The images people put in their Compose files, on both architectures: which start and answer under PRoot, and
  # why the others do not. Only the images the release notes promise must pass; the table is the record.
  compatibility:
    name: Image compatibility (${{ matrix.arch }}, ${{ matrix.shard }}/2)
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        shard: [0, 1]
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    # 13 images of at most 4 minutes each.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build the same patched PRoot as Android
        run: bash build/ci/containers-proot.sh "$RUNNER_TEMP/containers-proot"
      - name: Start each common image and record whether it answers
        env:
          TABSTUDIO_CONTAINER_REQUIRED: '1'
          TABSTUDIO_CONTAINER_COMPAT: '1'
          TABSTUDIO_CONTAINER_COMPAT_OUT: ${{ github.workspace }}/ci-out/compatibility-${{ matrix.arch }}-${{ matrix.shard }}.md
          TABSTUDIO_CONTAINER_COMPAT_SHARD: ${{ matrix.shard }}
          TABSTUDIO_CONTAINER_COMPAT_SHARDS: '2'
        run: |
          mkdir -p ci-out
          dotnet test tests/TabStudio.Containers.Tests -c Release -warnaserror --filter 'FullyQualifiedName~CompatibilityTests' --logger 'console;verbosity=detailed' > ci-out/compatibility.log 2>&1 || { tail -n 80 ci-out/compatibility.log; exit 1; }
      - name: The compatibility table
        if: always()
        run: |
          file=ci-out/compatibility-${{ matrix.arch }}-${{ matrix.shard }}.md
          if [ -f "$file" ]; then cat "$file"; cat "$file" >> "$GITHUB_STEP_SUMMARY"; else echo "No table was written."; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ matrix.arch }}
          path: ci-out/
