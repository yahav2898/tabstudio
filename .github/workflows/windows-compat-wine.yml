# Temporary: builds Wine for Alpine Linux on aarch64 for the Windows Compatibility spike, cached by its script.
name: Windows Compatibility Wine build

on:
  push:
    branches: ['agent/windows-compat']
    paths: ['build/windows-compat/spike/build-wine.sh', '.github/workflows/windows-compat-wine.yml']

permissions:
  contents: write

concurrency:
  group: wcwine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wine:
    name: Build Wine for Alpine aarch64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: wine-build
          key: wcspike-wine-11.0-alpine3.24-aarch64-${{ hashFiles('build/windows-compat/spike/build-wine.sh') }}
      - name: Build Wine
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ci-out wine-build
          docker run --rm -v "$PWD:/w" -w /w alpine:3.24 sh build/windows-compat/spike/build-wine.sh /w/wine-build 2>&1 | tail -n 80
          sudo chown -R "$(id -u)" wine-build
          test -f wine-build/wine.tar.gz
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: wine-build
          key: wcspike-wine-11.0-alpine3.24-aarch64-${{ hashFiles('build/windows-compat/spike/build-wine.sh') }}
      - name: Collect logs
        if: always()
        run: |
          mkdir -p ci-out
          cp wine-build/*.txt ci-out/ 2> /dev/null || true
      - name: Publish logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/ci/publish-logs.sh wcwine ${{ job.status }}
