name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  libraries:
    name: Build and test libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-libs-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-libs-

      - name: Build and test
        run: |
          mkdir -p ci-out
          status=0
          # Every test project except the UI tests, which run in their own job.
          for project in tests/*.Tests; do
            name=$(basename "$project")
            [ "$name" = "TabStudio.App.Tests" ] && continue
            dotnet test "$project" -c Release --logger "console;verbosity=normal" > "ci-out/$name.log" 2>&1 || status=1
            tail -n 40 "ci-out/$name.log"
          done
          exit $status

      - name: Publish logs
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/ci/publish-logs.sh libraries ${{ job.status }}
