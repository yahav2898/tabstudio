name: CI

# A throwaway branch's workflow: only the IDE tests that render and check the audited panels, with their logs and
# screenshots published to ci-logs. Never merged.
on:
  push:
    branches: ['agent/design-polish-before', 'agent/design-polish-scratch']

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  DOTNET_MODIFIABLE_ASSEMBLIES: debug

jobs:
  app:
    name: Audited panels
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-app-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-app-
      - name: Test the audited panels
        env:
          TABSTUDIO_SCREENSHOTS: ${{ github.workspace }}/ci-out/screenshots
        run: |
          mkdir -p ci-out/screenshots
          status=0
          filter="$(cat build/ci/scratch-filter.txt)"
          dotnet test tests/TabStudio.App.Tests -c Release -p:TreatWarningsAsErrors=true --blame-hang-timeout 10m --blame-hang-dump-type none \
            --filter "$filter" --logger "console;verbosity=normal" > ci-out/TabStudio.App.Tests.log 2>&1 || status=1
          grep -E "error|Failed|Passed!|Failed!" ci-out/TabStudio.App.Tests.log | tail -n 150
          exit $status
      - name: Publish logs and screenshots
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/ci/publish-logs.sh app ${{ job.status }}
