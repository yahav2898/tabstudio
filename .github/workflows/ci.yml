name: CI

on:
  push:
    branches: [main, 'agent/**']
    # A version tag (v0.1.0) builds, tests and publishes that release.
    tags: ['v*']
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  # Required at process startup, before CoreCLR loads the test host or any dynamically emitted Debug assemblies.
  DOTNET_MODIFIABLE_ASSEMBLIES: debug

jobs:
  mobile-android:
    name: Android template in ARM64 Alpine
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Generate the IDE's Android template and build plan
        run: |
          dotnet run --project build/mobile/TabStudio.Mobile.Smoke.csproj -- "$GITHUB_WORKSPACE/ci-out/mobile-template"
          dotnet run --project build/mobile/TabStudio.Mobile.Smoke.csproj -- "$GITHUB_WORKSPACE/ci-out/capacitor-template" capacitor
      - name: Build with the catalog SDK in Alpine on ARM64
        run: |
          set -o pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" alpine:3.24 \
            sh -c 'apk add --no-cache python3 ca-certificates && python3 build/mobile/alpine-build.py "$1" "$2"' \
            sh "$GITHUB_WORKSPACE/ci-out/mobile-template" "$GITHUB_WORKSPACE/ci-out/capacitor-template" 2>&1 | tee ci-out/mobile-alpine-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-android-template
          path: |
            ci-out/mobile-alpine-build.log
            ci-out/mobile-template/app/build/outputs/apk/debug/*.apk
            ci-out/capacitor-template/android/app/build/outputs/apk/debug/*.apk

  libraries:
    name: Build and test libraries
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tabstudio
          POSTGRES_PASSWORD: tabstudio_ci
          POSTGRES_DB: tabstudio
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U tabstudio -d tabstudio"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TABSTUDIO_POSTGRES: Host=127.0.0.1;Port=5432;Database=tabstudio;Username=tabstudio;Password=tabstudio_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-libs-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-libs-

      # Real language servers and a debug adapter, for the integration tests of TabStudio.LanguageServers.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install language servers and debug adapters
        run: |
          npm install -g pyright typescript-language-server typescript@5 vscode-langservers-extracted@4.10.0
          python -m pip install debugpy
          echo "TABSTUDIO_REAL_SERVERS=1" >> "$GITHUB_ENV"
          mkdir -p ci-out
          { npm ls -g --depth=0; ls -l "$(command -v typescript-language-server)"; python -m pip show debugpy; } > ci-out/language-servers.txt 2>&1 || true

      - name: Test CI retry policy
        run: python -m unittest discover -s build/ci/tests

      - name: Test PRoot debugger thread waits
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libtalloc-dev gawk
          bash build/android/native/tests/ptrace-threads.sh > ci-out/proot-thread-waits.log 2>&1 || { cat ci-out/proot-thread-waits.log; exit 1; }
          cat ci-out/proot-thread-waits.log

      - name: Build and test
        run: |
          mkdir -p ci-out
          status=0
          # Every test project except the UI tests, which run in their own job.
          for project in tests/*.Tests; do
            name=$(basename "$project")
            [ "$name" = "TabStudio.App.Tests" ] && continue
            if ! dotnet test "$project" -c Release -p:TreatWarningsAsErrors=true --logger "console;verbosity=normal" > "ci-out/$name.log" 2>&1; then
              if ! python build/ci/test-retry.py "ci-out/$name.log" "$name"; then
                tail -n 80 "ci-out/$name.log"
                status=1
                continue
              fi
              # Known intermittent failures are tracked on the board; one retry keeps them from blocking a release,
              # and FLAKY.txt and a warning keep them visible. A second failure fails the job.
              echo "::warning::$name failed once; running it again. The first attempt is in ci-out/$name.log."
              if dotnet test "$project" -c Release -p:TreatWarningsAsErrors=true --logger "console;verbosity=normal" > "ci-out/$name.retry.log" 2>&1; then
                echo "$name: the first attempt failed and the retry passed (see $name.log)" >> ci-out/FLAKY.txt
              else
                status=1
              fi
            fi
            tail -n 40 "ci-out/$name.log"
          done
          exit $status

      - name: Save first-attempt test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-test-logs
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ci-out/*.log
            ci-out/FLAKY.txt
            ci-out/*.json
            ci-out/Sequence_*.xml
            tests/**/TestResults/**/Sequence_*.xml

      - name: Publish logs
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/ci/publish-logs.sh libraries ${{ job.status }}

  app:
    name: Build and test the IDE
    # Ubuntu 24.04, not ubuntu-latest: the tools installed below (Swift's toolchain, LLVM and the PHP and Java
    # packages) are the ones published for 24.04, and since ubuntu-latest became Ubuntu 26.04 the IDE's test host
    # aborted at its first test there ("free(): invalid pointer"). The IDE's own code passes on 26.04 with only
    # Node.js, Python and Go installed.
    runs-on: ubuntu-24.04
    # A healthy run takes about 27 minutes: setup (apt alone may take its full 10), the tool tests, and about 20
    # minutes of IDE tests in both themes. The one retry below repeats the whole dark-theme run, and a hung first
    # attempt only ends at its 12-minute hang timeout, so the budget holds both attempts and the log publishing.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-app-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-app-

      # The editor and debugger tests for Python files use real Pyright and debugpy.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-analyzer, rust-src

      - name: Install LLVM, C and C++ tools
        timeout-minutes: 10
        run: |
          # A stalled package mirror must fail setup rather than occupy the
          # runner for hours before any IDE or real-tool tests can start.
          # The hosted image's Azure mirror delivered LLVM at about 40 KB/s
          # in the stalled run. Prefer Ubuntu's primary mirror for these
          # signed packages; leave the image's security sources unchanged.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install -y clang-19 clangd-19 lldb-19 cmake make
          mkdir -p "$RUNNER_TEMP/cpp-bin"
          ln -s /usr/bin/clangd-19 "$RUNNER_TEMP/cpp-bin/clangd"
          ln -s /usr/bin/lldb-dap-19 "$RUNNER_TEMP/cpp-bin/lldb-dap"
          echo "$RUNNER_TEMP/cpp-bin" >> "$GITHUB_PATH"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Java tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y maven
          cc -shared -nostdlib -fPIC -O2 -Wall -Wextra -Werror build/android/native/jvm-mapping.c -o "$RUNNER_TEMP/libtabstudio-jvm.so"
          LD_PRELOAD="$RUNNER_TEMP/libtabstudio-jvm.so" java -version
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.4-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "f1771298a70f6db5a29daf62378c4e18a17fc33c9ba6b14362e0cdf40610380d  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.14.4/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/jdtls" "$RUNNER_TEMP/java-debug"
          curl -fsSL https://download.eclipse.org/jdtls/milestones/1.58.0/jdt-language-server-1.58.0-202604151538.tar.gz -o "$RUNNER_TEMP/jdtls.tar.gz"
          echo "2a5bbe55ec91b4325392050dc422cead3220a2459b3766be35e1fff45b4a50d9  $RUNNER_TEMP/jdtls.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/jdtls.tar.gz" -C "$RUNNER_TEMP/jdtls"
          curl -fsSL https://open-vsx.org/api/vscjava/vscode-java-debug/0.60.0/file/vscjava.vscode-java-debug-0.60.0.vsix -o "$RUNNER_TEMP/java-debug.vsix"
          echo "f09ebe358a7b08b3c17b21b8d8207b0649acad120eb6f1604dc4f15379f59d66  $RUNNER_TEMP/java-debug.vsix" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/java-debug.vsix" -d "$RUNNER_TEMP/java-debug"
          echo "$RUNNER_TEMP/jdtls/bin" >> "$GITHUB_PATH"
          echo "TABSTUDIO_JAVA_DEBUG_BUNDLE=$RUNNER_TEMP/java-debug/extension/server/com.microsoft.java.debug.plugin-0.53.2.jar" >> "$GITHUB_ENV"

      # PHP with Composer and Xdebug, which TabStudio loads itself for debug runs, as it does on a tablet.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, sqlite3, pdo_sqlite, xdebug
          tools: composer
          coverage: none

      - name: Install PHP, Kotlin and Swift tools
        timeout-minutes: 15
        run: |
          # Xdebug stays installed but off: the IDE's debug runs load it from an ini file of their own.
          for ini in $(php --ini | grep -o '/[^, ]*xdebug[^, ]*\.ini'); do sudo rm -f "$ini"; done
          php -m | grep -qi xdebug && { echo "Xdebug is still loaded"; exit 1; }
          php -d zend_extension=xdebug.so -m | grep -qi xdebug
          mkdir -p "$RUNNER_TEMP/php-tools/bin" "$RUNNER_TEMP/php-debug"
          curl -fsSL https://github.com/phpactor/phpactor/releases/download/2026.10.07.0/phpactor.phar -o "$RUNNER_TEMP/php-tools/phpactor.phar"
          echo "b28bf6166e016d539fc2f2aec18ef918b12590e436a6f1ccbdf30b5bbdbdb16b  $RUNNER_TEMP/php-tools/phpactor.phar" | sha256sum -c -
          printf '#!/bin/sh\nexec php "%s/php-tools/phpactor.phar" "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/php-tools/bin/phpactor"
          curl -fsSL https://open-vsx.org/api/xdebug/php-debug/1.40.2/file/xdebug.php-debug-1.40.2.vsix -o "$RUNNER_TEMP/php-debug.vsix"
          echo "17631993fe800083a2fc89a6782c8bf58a79603ad201ddff60d9b59ba2345d5f  $RUNNER_TEMP/php-debug.vsix" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/php-debug.vsix" -d "$RUNNER_TEMP/php-debug"
          printf '#!/bin/sh\nexec node "%s/php-debug/extension/out/phpDebug.js" "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/php-tools/bin/php-debug-adapter"
          chmod +x "$RUNNER_TEMP/php-tools/bin/"*
          echo "$RUNNER_TEMP/php-tools/bin" >> "$GITHUB_PATH"
          # The Kotlin compiler and JetBrains' Kotlin language server, pinned as the Toolchain Store pins them.
          curl -fsSL https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip -o "$RUNNER_TEMP/kotlinc.zip"
          echo "7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd  $RUNNER_TEMP/kotlinc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/kotlinc.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/kotlin-lsp/bin"
          curl -fsSL https://download.jetbrains.com/language-server/kotlin-server/263.7084.0/kotlin-server-0.0.27-linux-amd64.vsix -o "$RUNNER_TEMP/kotlin-lsp.vsix"
          echo "6787185abb0e7f3b527484bb6cc4a881ce42b2e39320626937e65839751075e9  $RUNNER_TEMP/kotlin-lsp.vsix" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/kotlin-lsp.vsix" -d "$RUNNER_TEMP/kotlin-lsp"
          rm "$RUNNER_TEMP/kotlin-lsp.vsix"
          printf '#!/bin/sh\nexec "%s/kotlin-lsp/extension/server/bin/intellij-server" "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/kotlin-lsp/bin/kotlin-lsp"
          chmod +x "$RUNNER_TEMP/kotlin-lsp/bin/kotlin-lsp" "$RUNNER_TEMP/kotlin-lsp/extension/server/bin/intellij-server"
          echo "$RUNNER_TEMP/kotlin-lsp/bin" >> "$GITHUB_PATH"
          # Swift's official toolchain for Ubuntu 24.04, with the packages swift.org lists for it.
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libz3-dev libncurses-dev libedit2 libpython3-dev > /dev/null
          curl -fsSL https://download.swift.org/swift-6.4.1-release/ubuntu2404/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE-ubuntu24.04.tar.gz -o "$RUNNER_TEMP/swift.tar.gz"
          echo "7d246c7114077ad01dba4ad897628446ada4c489d6c7dbcf39ae3f25cbe17e8b  $RUNNER_TEMP/swift.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/swift"
          tar -xzf "$RUNNER_TEMP/swift.tar.gz" -C "$RUNNER_TEMP/swift" --strip-components=1
          rm "$RUNNER_TEMP/swift.tar.gz"
          echo "$RUNNER_TEMP/swift/usr/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swift/usr/bin/swift" --version

      - name: Install language servers and debug adapters
        run: |
          npm install -g pyright typescript-language-server typescript@5 vscode-langservers-extracted@4.10.0
          python -m pip install debugpy
          go install golang.org/x/tools/gopls@v0.21.1
          go install github.com/go-delve/delve/cmd/dlv@v1.26.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          # vscode-js-debug's adapter, under the command name the Toolchain Store gives it on a tablet.
          mkdir -p "$RUNNER_TEMP/js-debug/bin"
          curl -fsSL https://github.com/microsoft/vscode-js-debug/releases/download/v1.140.0/js-debug-dap-v1.140.0.tar.gz | tar -xz -C "$RUNNER_TEMP/js-debug"
          printf '#!/bin/sh\nexec node "%s/js-debug/src/dapDebugServer.js" "$@"\n' "$RUNNER_TEMP/js-debug" > "$RUNNER_TEMP/js-debug/bin/js-debug-adapter"
          chmod +x "$RUNNER_TEMP/js-debug/bin/js-debug-adapter"
          echo "$RUNNER_TEMP/js-debug/bin" >> "$GITHUB_PATH"
          echo "TABSTUDIO_REAL_SERVERS=1" >> "$GITHUB_ENV"

      - name: Test Go tools
        env:
          TABSTUDIO_SCREENSHOTS: ${{ github.workspace }}/ci-out/screenshots
        run: |
          mkdir -p ci-out/screenshots
          status=0
          dotnet test tests/TabStudio.App.Tests -c Release --blame-hang-timeout 5m --blame-hang-dump-type none \
            --filter "FullyQualifiedName~ToolchainLanguageToolsTests.A_Go_template" --logger "console;verbosity=normal" \
            > ci-out/go-tools.log 2>&1 || status=$?
          tail -n 80 ci-out/go-tools.log
          exit "$status"

      - name: Test Rust tools
        env:
          TABSTUDIO_SCREENSHOTS: ${{ github.workspace }}/ci-out/screenshots
        run: |
          mkdir -p ci-out/screenshots
          status=0
          dotnet test tests/TabStudio.App.Tests -c Release --blame-hang-timeout 5m --blame-hang-dump-type none \
            --filter "FullyQualifiedName~ToolchainLanguageToolsTests.A_Rust_template" --logger "console;verbosity=normal" \
            > ci-out/rust-tools.log 2>&1 || status=$?
          tail -n 80 ci-out/rust-tools.log
          exit "$status"

      - name: Test C and C++ tools
        env:
          TABSTUDIO_SCREENSHOTS: ${{ github.workspace }}/ci-out/screenshots
        run: |
          mkdir -p ci-out/screenshots
          status=0
          dotnet test tests/TabStudio.App.Tests -c Release --blame-hang-timeout 5m --blame-hang-dump-type none \
            --filter "FullyQualifiedName~ToolchainLanguageToolsTests.A_Cpp_template" --logger "console;verbosity=normal" \
            > ci-out/cpp-tools.log 2>&1 || status=$?
          tail -n 80 ci-out/cpp-tools.log
          exit "$status"

      - name: Test Java tools
        env:
          TABSTUDIO_SCREENSHOTS: ${{ github.workspace }}/ci-out/screenshots
        run: |
          mkdir -p ci-out/screenshots
          status=0
          dotnet test tests/TabStudio.App.Tests -c Release --blame-hang-timeout 5m --blame-hang-dump-type none \
            --filter "FullyQualifiedName~ToolchainLanguageToolsTests.A_Java_template|FullyQualifiedName~ToolchainLanguageToolsTests.Java_" --logger "console;verbosity=normal" \
            > ci-out/java-tools.log 2>&1 || status=$?
          tail -n 80 ci-out/java-tools.log
          exit "$status"

      - name: Test PHP tools
        env:
          TABSTUDIO_SCREENSHOTS: ${{ github.workspace }}/ci-out/screenshots
        run: |
          mkdir -p ci-out/screenshots
          { echo "PATH=$PATH"; for t in php composer phpactor php-debug-adapter kotlinc gradle kotlin-lsp jdtls swift sourcekit-lsp lldb-dap; do printf '%s: ' "$t"; command -v "$t" || echo missing; done; ls -la "$RUNNER_TEMP/php-tools/bin" || true; phpactor --version || true; } > ci-out/tools-path.log 2>&1
          status=0
          dotnet test tests/TabStudio.App.Tests -c Release --blame-hang-timeout 10m --blame-hang-dump-type none \
            --filter "FullyQualifiedName~ToolchainLanguageToolsTests.A_PHP_template" --logger "console;verbosity=normal" \
            > ci-out/php-tools.log 2>&1 || status=$?
          tail -n 80 ci-out/php-tools.log
          exit "$status"

      - name: Test Kotlin tools
        env:
          TABSTUDIO_SCREENSHOTS: ${{ github.workspace }}/ci-out/screenshots
        run: |
          mkdir -p ci-out/screenshots
          status=0
          dotnet test tests/TabStudio.App.Tests -c Release --blame-hang-timeout 10m --blame-hang-dump-type none \
            --filter "FullyQualifiedName~ToolchainLanguageToolsTests.A_Kotlin_Gradle_template" --logger "console;verbosity=normal" \
            > ci-out/kotlin-tools.log 2>&1 || status=$?
          tail -n 80 ci-out/kotlin-tools.log
          exit "$status"

      - name: Test Swift tools
        env:
          TABSTUDIO_SCREENSHOTS: ${{ github.workspace }}/ci-out/screenshots
        run: |
          mkdir -p ci-out/screenshots
          status=0
          dotnet test tests/TabStudio.App.Tests -c Release --blame-hang-timeout 10m --blame-hang-dump-type none \
            --filter "FullyQualifiedName~ToolchainLanguageToolsTests.A_Swift_package_template" --logger "console;verbosity=normal" \
            > ci-out/swift-tools.log 2>&1 || status=$?
          tail -n 80 ci-out/swift-tools.log
          exit "$status"

      - name: Prepare native backing services in Alpine
        timeout-minutes: 15
        run: bash build/ci/services-alpine.sh "$RUNNER_TEMP/services-alpine"

      # This test deliberately collects the entire process heap during every PNG encode. Run it in its own
      # test host so previous IDE workspaces cannot make that heap several gigabytes; all 100 captures remain.
      - name: Test screenshot lifetime under GC
        run: |
          mkdir -p ci-out
          status=0
          for theme in Dark Light; do
            log="ci-out/ScreenshotLifetime.$theme.log"
            run_screenshot_test() {
              TABSTUDIO_THEME="$theme" dotnet test tests/TabStudio.App.Tests -c Release --no-build \
                --blame --blame-hang-timeout 5m --blame-hang-dump-type none \
                --filter "FullyQualifiedName~ScreenshotLifetimeTests" --logger "console;verbosity=normal" > "$1" 2>&1
            }
            if ! run_screenshot_test "$log"; then
              tail -n 80 "$log"
              echo "::warning::The baseline screenshot GC test failed once in $theme; retrying in a fresh host."
              if run_screenshot_test "ci-out/ScreenshotLifetime.$theme.retry.log"; then
                echo "ScreenshotLifetime ($theme): the first attempt failed and the retry passed (see ScreenshotLifetime.$theme.log)" >> ci-out/FLAKY.txt
              else
                status=1
              fi
              tail -n 40 "ci-out/ScreenshotLifetime.$theme.retry.log"
            else
              tail -n 20 "$log"
            fi
          done
          exit "$status"

      - name: Build the desktop host and test the IDE
        env:
          TABSTUDIO_SCREENSHOTS: ${{ github.workspace }}/ci-out/screenshots
          TABSTUDIO_RECORDED_UI_TESTS: ${{ runner.temp }}/recorded-ui-tests
        run: |
          mkdir -p ci-out/screenshots
          status=0
          dotnet build src/TabStudio.Desktop -c Release -p:TreatWarningsAsErrors=true > ci-out/desktop-build.log 2>&1 || status=1
          tail -n 40 ci-out/desktop-build.log
          # A test host that dies leaves a crash report (its threads' stacks) when the runtime saw the crash.
          mkdir -p "$RUNNER_TEMP/crash"
          # The 100-frame GC stress can take eleven minutes on hosted runners; do not abort a healthy run.
          run_ide_tests() {
            DOTNET_DbgEnableMiniDump=1 DOTNET_DbgMiniDumpType=1 DOTNET_EnableCrashReport=1 DOTNET_DbgMiniDumpName="$RUNNER_TEMP/crash/%e.%p.dmp" \
              dotnet test tests/TabStudio.App.Tests -c Release -p:TreatWarningsAsErrors=true --blame --blame-hang-timeout 12m --blame-hang-dump-type none --filter "FullyQualifiedName!~ScreenshotLifetimeTests&FullyQualifiedName!~ToolchainLanguageToolsTests.A_PHP_template&FullyQualifiedName!~ToolchainLanguageToolsTests.A_Kotlin_Gradle_template&FullyQualifiedName!~ToolchainLanguageToolsTests.A_Swift_package_template" --logger "console;verbosity=normal" > "$1" 2>&1
          }
          first=0
          run_ide_tests ci-out/TabStudio.App.Tests.log || first=1
          tail -n 80 ci-out/TabStudio.App.Tests.log
          if [ $first -ne 0 ]; then
            # Known intermittent failures (a native crash in the test host, slow servers) are tracked on the board;
            # one retry keeps them from blocking a release, and FLAKY.txt and a warning keep them visible.
            echo "::warning::The IDE tests failed once; running them again. The first attempt is in ci-out/TabStudio.App.Tests.log."
            if ! python build/ci/test-retry.py ci-out/TabStudio.App.Tests.log TabStudio.App.Tests; then
              status=1
            elif run_ide_tests ci-out/TabStudio.App.Tests.retry.log; then
              echo "TabStudio.App.Tests: the first attempt failed and the retry passed (see TabStudio.App.Tests.log)" >> ci-out/FLAKY.txt
            else
              status=1
            fi
            if [ -f ci-out/TabStudio.App.Tests.retry.log ]; then tail -n 40 ci-out/TabStudio.App.Tests.retry.log; fi
          fi
          # The same tests in the light theme, for light screenshots (screenshots/light); the palette and design tests ran above in both.
          # The PHP, Kotlin and Swift tool tests ran in their own steps above.
          mkdir -p ci-out/screenshots/light
          run_light_tests() {
            TABSTUDIO_THEME=Light TABSTUDIO_SCREENSHOTS="$TABSTUDIO_SCREENSHOTS/light" \
              dotnet test tests/TabStudio.App.Tests -c Release -p:TreatWarningsAsErrors=true --no-build --blame --blame-hang-timeout 12m --blame-hang-dump-type none --filter "FullyQualifiedName!~TabStudio.App.Tests.Theming&FullyQualifiedName!~TabStudio.App.Tests.Design&FullyQualifiedName!~ScreenshotLifetimeTests&FullyQualifiedName!~ToolchainLanguageToolsTests.A_PHP_template&FullyQualifiedName!~ToolchainLanguageToolsTests.A_Kotlin_Gradle_template&FullyQualifiedName!~ToolchainLanguageToolsTests.A_Swift_package_template" \
              --logger "console;verbosity=normal" > "$1" 2>&1
          }
          light=0
          run_light_tests ci-out/TabStudio.App.Tests.Light.log || light=1
          tail -n 20 ci-out/TabStudio.App.Tests.Light.log
          if [ $light -ne 0 ]; then
            echo "::warning::The IDE tests in the light theme failed once; running them again. The first attempt is in ci-out/TabStudio.App.Tests.Light.log."
            if ! python build/ci/test-retry.py ci-out/TabStudio.App.Tests.Light.log TabStudio.App.Tests; then
              status=1
            elif run_light_tests ci-out/TabStudio.App.Tests.Light.retry.log; then
              echo "TabStudio.App.Tests (light theme): the first attempt failed and the retry passed (see TabStudio.App.Tests.Light.log)" >> ci-out/FLAKY.txt
            else
              status=1
            fi
            if [ -f ci-out/TabStudio.App.Tests.Light.retry.log ]; then tail -n 40 ci-out/TabStudio.App.Tests.Light.retry.log; fi
          fi
          # Every view of the IDE was audited for accessibility (touch targets, names, contrast, and clipping at the
          # largest text size) in both themes; the counts go to screenshots/accessibility/summary.md.
          python3 build/ci/accessibility-coverage.py "$TABSTUDIO_SCREENSHOTS" "$TABSTUDIO_SCREENSHOTS/light" > ci-out/accessibility-coverage.log 2>&1 || status=1
          tail -n 40 ci-out/accessibility-coverage.log
          if [ $first -ne 0 ] || [ $light -ne 0 ] || [ $status -ne 0 ]; then
            {
              echo "== Processes left running"; ps -eo pid,ppid,pgid,rss,etime,args --sort=-rss | head -n 40
              echo "== Kernel messages"; sudo dmesg | tail -n 40
            } > ci-out/diagnostics.txt 2>&1 || true
            cp "$RUNNER_TEMP"/crash/*.json ci-out/ 2>/dev/null || true
            find tests/TabStudio.App.Tests/TestResults -name 'Sequence_*.xml' -exec cp {} ci-out/ \; 2>/dev/null || true
          fi
          # The UI test the swarm's test recorded on a phone runs as its users' CI runs it: dotnet test, headless.
          recorded=$(find "$TABSTUDIO_RECORDED_UI_TESTS" -name '*.UITests.csproj' 2>/dev/null | head -n 1)
          if [ -n "$recorded" ]; then
            dotnet test "$recorded" --blame --blame-hang-timeout 12m --blame-hang-dump-type none --logger "console;verbosity=normal" > ci-out/recorded-ui-tests.log 2>&1 || status=1
            tail -n 30 ci-out/recorded-ui-tests.log
          else
            echo "No recorded UI test project was written." | tee ci-out/recorded-ui-tests.log
            status=1
          fi
          exit $status

      - name: Save first-attempt test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ide-test-logs
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ci-out/*.log
            ci-out/FLAKY.txt
            ci-out/*.json
            ci-out/Sequence_*.xml
            tests/**/TestResults/**/Sequence_*.xml

      - name: Publish logs and screenshots
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/ci/publish-logs.sh app ${{ job.status }}

  # Public repositories, pinned to commits in build/ci/real-repos.json, opened in the real IDE as a person would on
  # the tablet. .NET repositories are built, each with an error baseline that may only go down. Python, Java, Rust and Node.js
  # repositories are set up by the IDE with the computer's toolchains, and Ctrl+F5 must start their programs: a web
  # app must answer in the web preview, a command-line program must exit with code 0. Reports and screenshots are
  # published.
  real-repos:
    name: Real repositories
    # Ubuntu 24.04, not ubuntu-latest: the tools installed below (Swift's toolchain, LLVM and the PHP and Java
    # packages) are the ones published for 24.04, and since ubuntu-latest became Ubuntu 26.04 the IDE's test host
    # aborted at its first test there ("free(): invalid pointer"). The IDE's own code passes on 26.04 with only
    # Node.js, Python and Go installed.
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    # SimplCommerce's first page needs its SQL Server database. SQL Server has no ARM64 Linux engine, so a tablet
    # connects to one on the network; here that is this x64 container, reached through TABSTUDIO_SQLSERVER.
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: TabStudio-ci-1433
        ports: [1433:1433]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P TabStudio-ci-1433 -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 20
      # node-express-realworld's PostgreSQL, which its .env names (build/ci/real-repos.json); F5 applies its migrations.
      # BookStack's MySQL, which its .env names; F5 applies its Laravel migrations.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: tabstudio-ci
          MYSQL_DATABASE: bookstack
        ports: [3306:3306]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptabstudio-ci" --health-interval 5s --health-timeout 5s --health-retries 30
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: tabstudio-ci
          POSTGRES_DB: realworld
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TABSTUDIO_SQLSERVER: Server=tcp:127.0.0.1,1433;Database=SimplCommerce;User ID=sa;Password=TabStudio-ci-1433;TrustServerCertificate=True;MultipleActiveResultSets=true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-real-repos-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'build/ci/real-repos.json') }}
          restore-keys: nuget-real-repos-

      # The toolchains the Python, Java, Rust and Node.js repositories run with, as the Toolchain Store installs them on a
      # tablet: Python with uv (which installs the CPython a project's pins need), OpenJDK 21 with Maven, Rust with Cargo,
      # Node.js 22 with npm, and Go (CMake and GCC are on the runner).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install Maven
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y maven
          mvn -v; cargo --version; uv --version; python3 --version; node --version; go version; cmake --version | head -1

      # PHP with Composer, the Kotlin compiler with Gradle, and Swift, for the PHP, Kotlin and Swift repositories, at the
      # versions the Toolchain Store installs.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, bcmath, gd, pdo_mysql, pdo_pgsql, pdo_sqlite, sqlite3, zip
          tools: composer
          coverage: none

      - name: Install Kotlin, Gradle and Swift
        timeout-minutes: 15
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.4-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "f1771298a70f6db5a29daf62378c4e18a17fc33c9ba6b14362e0cdf40610380d  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.14.4/bin" >> "$GITHUB_PATH"
          curl -fsSL https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip -o "$RUNNER_TEMP/kotlinc.zip"
          echo "7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd  $RUNNER_TEMP/kotlinc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/kotlinc.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libz3-dev libncurses-dev libedit2 libpython3-dev > /dev/null
          curl -fsSL https://download.swift.org/swift-6.4.1-release/ubuntu2404/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE-ubuntu24.04.tar.gz -o "$RUNNER_TEMP/swift.tar.gz"
          echo "7d246c7114077ad01dba4ad897628446ada4c489d6c7dbcf39ae3f25cbe17e8b  $RUNNER_TEMP/swift.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/swift"
          tar -xzf "$RUNNER_TEMP/swift.tar.gz" -C "$RUNNER_TEMP/swift" --strip-components=1
          rm "$RUNNER_TEMP/swift.tar.gz"
          echo "$RUNNER_TEMP/swift/usr/bin" >> "$GITHUB_PATH"
          php --version; composer --version; "$RUNNER_TEMP/swift/usr/bin/swift" --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.cargo/registry
            ~/.cache/uv
            ~/.cache/pip
            ~/.npm
            ~/.cache/composer
            ~/.gradle/caches
          key: real-repos-tools-${{ hashFiles('build/ci/real-repos.json') }}
          restore-keys: real-repos-tools-

      - name: Clone the pinned repositories
        run: python3 build/ci/real-repos.py "$RUNNER_TEMP/real-repos"

      - name: Create the databases their first pages need
        run: |
          python3 build/ci/real-repos.py --migrate "$RUNNER_TEMP/real-repos" 2>&1 | tail -n 40

      - name: Open and build them in TabStudio
        env:
          TABSTUDIO_REAL_REPOS: ${{ runner.temp }}/real-repos
          TABSTUDIO_REAL_REPOS_OUT: ${{ github.workspace }}/ci-out
          TABSTUDIO_SCREENSHOTS: ${{ github.workspace }}/ci-out/screenshots
        run: |
          mkdir -p ci-out/screenshots
          status=0
          dotnet test tests/TabStudio.App.Tests -c Release -p:TreatWarningsAsErrors=true --blame-hang-timeout 90m --blame-hang-dump-type none \
            --filter "FullyQualifiedName~RealRepositoryTests" --logger "console;verbosity=normal" > ci-out/test.log 2>&1 || status=$?
          tail -n 60 ci-out/test.log
          for summary in ci-out/summary.md ci-out/summary-polyglot.md; do
            if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; cat "$summary"; fi
          done
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-repos
          path: ci-out/
          if-no-files-found: ignore

      - name: Publish logs and screenshots
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/ci/publish-logs.sh real-repos ${{ job.status }}

  ssh:
    name: SSH and SFTP integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-ssh-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-ssh-
            nuget-app-
      - name: Start OpenSSH integration container
        run: |
          set -euo pipefail
          mkdir -p ci-out
          bash build/ci/start-ssh-server.sh 2>&1 | tee ci-out/ssh-start.log
      - name: Test real SSH, SFTP, remote workspace and publishing
        env:
          TABSTUDIO_SCREENSHOTS: ${{ github.workspace }}/ci-out/screenshots
        run: |
          set -uo pipefail
          mkdir -p ci-out/screenshots
          status=0
          # Both projects always run, so one failure never hides the other's output.
          dotnet test tests/TabStudio.Remote.Tests -c Release --blame-hang-timeout 2m --blame-hang-dump-type none --logger "console;verbosity=normal" 2>&1 | tee ci-out/ssh-library.log || status=1
          dotnet test tests/TabStudio.App.Tests -c Release --filter FullyQualifiedName~RemoteSsh --blame-hang-timeout 2m --blame-hang-dump-type none --logger "console;verbosity=normal" 2>&1 | tee ci-out/ssh-app.log || status=1
          exit $status
      - name: Capture OpenSSH logs
        if: always()
        run: |
          mkdir -p ci-out
          { docker ps -a; docker logs tabstudio-openssh; } > ci-out/sshd.log 2>&1 || true
      - name: Publish logs
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/ci/publish-logs.sh ssh ${{ job.status }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssh-integration
          path: ci-out
          retention-days: 7

  services:
    name: Native Services (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Prepare Alpine and PRoot
        run: bash build/ci/services-alpine.sh "$RUNNER_TEMP/services-alpine"
      - name: Test parsing, mapping, PostgreSQL and Redis in PRoot
        run: |
          mkdir -p ci-out
          if ! dotnet test tests/TabStudio.Services.Tests -c Release --logger "console;verbosity=normal" > ci-out/services.log 2>&1; then
            echo "::warning::Services tests failed once; retrying."
            dotnet test tests/TabStudio.Services.Tests -c Release --logger "console;verbosity=normal" > ci-out/services.retry.log 2>&1 || { cat ci-out/services.retry.log; exit 1; }
            echo "Native Services (${{ matrix.arch }}): first attempt failed, retry passed" >> ci-out/FLAKY.txt
          fi
          cat ci-out/services.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-services-${{ matrix.arch }}
          path: |
            ci-out/
            ${{ runner.temp }}/services-alpine/*log

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-android

      # PRoot and its loader, which run toolchains on the device; cached until the build script changes.
      - uses: actions/cache@v4
        with:
          path: artifacts/native
          key: android-native-${{ hashFiles('build/android/native/build.sh', 'build/android/native/sources.sh', 'build/android/native/*.patch', 'build/android/native/*.c', 'build/pic/build_box64.py', 'build/pic/spike.py', 'build/pic/assets.lock.json', 'build/pic/*.patch') }}-arm

      - name: Build the toolchain runtime
        run: |
          mkdir -p ci-out
          bash build/android/native/build.sh artifacts/native arm64-v8a armeabi-v7a 2>&1 | tee ci-out/native-build.log
          exit "${PIPESTATUS[0]}"

      - name: Build the local AI runtime
        run: bash build/local-ai/android.sh arm64-v8a

      - name: Build the APK
        run: |
          mkdir -p ci-out
          status=0
          dotnet publish src/TabStudio.Android -c Release -p:TreatWarningsAsErrors=true -f net10.0-android \
            -p:TabStudioBuildNumber=$(( ($(date +%s) - 1767225600) / 60 )) \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" \
            > ci-out/android-build.log 2>&1 || status=$?
          grep -E ': (warning|error) ' ci-out/android-build.log | sort -u > ci-out/android-build-warnings.txt || true
          tail -n 60 ci-out/android-build.log
          echo "== $(wc -l < ci-out/android-build-warnings.txt) distinct warnings and errors"
          cat ci-out/android-build-warnings.txt
          exit $status

      - name: Verify the APK
        run: |
          apk="$(find src/TabStudio.Android/bin/Release/net10.0-android/publish -name '*-Signed.apk' | head -n 1)"
          test -n "$apk" || { echo "The build produced no signed APK." >&2; exit 1; }
          cp "$apk" ci-out/TabStudio.apk
          bash build/ci/android-verify-apk.sh ci-out/TabStudio.apk ci-out/apk-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TabStudio-apk
          path: ci-out/TabStudio.apk
          if-no-files-found: error
          # An APK is already a zip.
          compression-level: 0

      - name: Publish the nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash build/ci/publish-nightly.sh nightly ci-out/TabStudio.apk

      - name: Keep the APK out of the published logs
        if: always()
        run: rm -f ci-out/*.apk

      - name: Publish logs
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/ci/publish-logs.sh android ${{ job.status }}

  android-emulator:
    name: Android emulator (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Keep all assertions visible even when a different group fails.
      fail-fast: false
      matrix:
        shard: [managed, ui, native, containers]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-android

      - uses: actions/cache@v4
        with:
          path: artifacts/native
          key: android-native-${{ hashFiles('build/android/native/build.sh', 'build/android/native/sources.sh', 'build/android/native/*.patch', 'build/android/native/*.c', 'build/pic/build_box64.py', 'build/pic/spike.py', 'build/pic/assets.lock.json', 'build/pic/*.patch') }}-x64

      - name: Build the toolchain runtime
        run: |
          mkdir -p ci-out
          bash build/android/native/build.sh artifacts/native x86_64 2>&1 | tee ci-out/native-build.log
          exit "${PIPESTATUS[0]}"

      - name: Build local AI and bundle its verified diagnostic model
        run: |
          bash build/local-ai/android.sh x86_64
          bash build/local-ai/download-tiny.sh artifacts/local-ai/tiny.gguf

      # GitHub's runners are x86_64, so the emulator needs an x86_64 build of the same app.
      - name: Build an x86_64 APK
        run: |
          mkdir -p ci-out
          status=0
          dotnet publish src/TabStudio.Android -c Release -p:TreatWarningsAsErrors=true -f net10.0-android -p:TabStudioRuntimeIdentifiers=android-x64 -p:TabStudioIncludeLocalAITestModel=true \
            -p:TabStudioBuildNumber=$(( ($(date +%s) - 1767225600) / 60 )) \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" \
            > ci-out/android-x64-build.log 2>&1 || status=$?
          tail -n 40 ci-out/android-x64-build.log
          [ "$status" -eq 0 ] || exit $status
          cp "$(find src/TabStudio.Android/bin/Release/net10.0-android/publish -name '*-Signed.apk' | head -n 1)" ci-out/TabStudio-x64.apk

      - name: Build the disposable app-UID PIC probe APK
        if: matrix.shard == 'native'
        run: |
          # Keep the existing IDE performance check on its normal Release APK.
          # Only the subsequent compiler probe needs a debuggable manifest for
          # run-as; both packages contain exactly the same application code.
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          tree = ET.parse('src/TabStudio.Android/Properties/AndroidManifest.xml')
          tree.getroot().find('application').set('{http://schemas.android.com/apk/res/android}debuggable', 'true')
          tree.write('src/TabStudio.Android/Properties/PicEmulatorManifest.xml', encoding='utf-8', xml_declaration=True)
          PY
          status=0
          dotnet publish src/TabStudio.Android -c Release -p:TreatWarningsAsErrors=true -f net10.0-android -p:TabStudioRuntimeIdentifiers=android-x64 \
            -p:AndroidManifest=Properties/PicEmulatorManifest.xml \
            -p:TabStudioBuildNumber=$(( ($(date +%s) - 1767225600) / 60 )) \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" \
            > ci-out/android-pic-probe-build.log 2>&1 || status=$?
          tail -n 40 ci-out/android-pic-probe-build.log
          [ "$status" -eq 0 ] || exit $status
          cp "$(find src/TabStudio.Android/bin/Release/net10.0-android/publish -name '*-Signed.apk' | head -n 1)" ci-out/TabStudio-pic-probe.apk

      - name: Prepare the verified PIC18 compiler and box64 interpreter for Android
        if: matrix.shard == 'native'
        run: |
          python3 build/pic/android_spike.py prepare --work "$RUNNER_TEMP/pic-android" \
            --output ci-out/pic-android --accept-microchip-license

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start TabStudio and run its self test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # WPF's .NET 10 browser runtime needs a modern WebView; API 29 ships Chrome 74.
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_c
          # Use the public Linux runner's four cores for the cold six-SDK
          # self-test; keep the existing memory and 900-second timing limits.
          cores: 4
          ram-size: 4096M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash build/pic/android-emulator-test.sh ci-out/TabStudio-x64.apk ci-out "$RUNNER_TEMP/pic-android" ci-out/TabStudio-pic-probe.apk ${{ matrix.shard }}

      # A crash's native backtrace has only offsets into the runtime's stripped libraries; this names the functions.
      - name: Name the functions in a crash's backtrace
        if: failure()
        run: |
          grep -q 'F DEBUG' ci-out/logcat-full.txt 2> /dev/null || exit 0
          bash build/ci/android-symbolize.sh ci-out/TabStudio-x64.apk x86_64 ci-out/symbolized ci-out/logcat-full.txt

      - name: Keep the APK out of the published logs
        if: always()
        run: rm -f ci-out/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-${{ matrix.shard }}
          path: ci-out/
          if-no-files-found: ignore

      # Pull request runs publish too, under branches/<number>-merge/, so their failures can be read as well.
      - name: Publish logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/ci/publish-logs.sh android-emulator-${{ matrix.shard }} ${{ job.status }}

  # Preserve the existing required check name, and fail it unless every matrix child passed.
  android-emulator-verdict:
    name: Run on an Android emulator
    if: always()
    needs: android-emulator
    runs-on: ubuntu-latest
    steps:
      - name: Require every emulator shard
        env:
          SHARDS_RESULT: ${{ needs.android-emulator.result }}
        run: test "$SHARDS_RESULT" = success

  # The Windows Bridge on real Windows: the desktop app builds for Windows, WPF, Windows Forms, Visual C++ and
  # .NET Framework apps build and run through the bridge's service on loopback, their windows are captured and
  # clicked through the input path, the WPF app is debugged with netcoredbg, and the bridge's own window and the
  # tablet showing a WPF app are rendered for screenshots.
  windows:
    name: Windows Bridge on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-windows-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-windows-

      - name: Build the desktop app and test the Windows Bridge
        env:
          TABSTUDIO_REAL_SERVERS: '1'
          TABSTUDIO_SCREENSHOTS: ${{ github.workspace }}/ci-out/screenshots
        run: |
          mkdir -p ci-out/screenshots
          status=0
          dotnet build src/TabStudio.Desktop -c Release > ci-out/desktop-build.log 2>&1 || status=1
          tail -n 30 ci-out/desktop-build.log
          for project in tests/TabStudio.WindowsBridge.Tests tests/TabStudio.WindowsBridge.Windows.Tests; do
            name=$(basename "$project")
            dotnet test "$project" -c Release --logger "console;verbosity=normal" > "ci-out/$name.log" 2>&1 || status=1
            tail -n 60 "ci-out/$name.log"
          done
          dotnet test tests/TabStudio.App.Tests -c Release --filter "FullyQualifiedName~WindowsBridge" --logger "console;verbosity=normal" > ci-out/TabStudio.App.Tests.log 2>&1 || status=1
          tail -n 60 ci-out/TabStudio.App.Tests.log
          # The errors and the failed tests, also as notices, which can be read even when the logs are not published.
          for log in ci-out/*.log; do
            summary=$( (grep -E -A1 "error [A-Z]+[0-9]+|^  Failed |Error Message:|Total tests:|Passed:|Failed:|Skipped:" "$log" | grep -v -E "^--$|^\[xUnit|^  Passed " | awk '!seen[$0]++' | head -c 3500 | sed -e 's/%/%25/g' | tr '\n' '\r' | sed -e 's/\r/%0A/g') || true)
            if [ -n "$summary" ]; then echo "::notice title=$(basename "$log")::$summary"; fi
          done
          exit $status

      - name: Publish logs and screenshots
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash build/ci/publish-logs-api.sh windows ${{ job.status }}

  # Publishes a versioned release once every check has passed: for a v* tag, or on main when
  # Directory.Build.props has a version that has release notes in docs/releases and no release yet.
  release:
    name: Publish the release
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: [libraries, app, services, android, android-emulator-verdict, windows, ssh, mobile-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: TabStudio-apk
          path: ci-out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash build/ci/publish-release.sh "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'auto' }}" ci-out/TabStudio.apk

