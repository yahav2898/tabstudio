name: IDE test investigation

# INVESTIGATION, to be removed: checks the fixes for three intermittent IDE test failures against the code before
# them. "unfixed" puts back the code before each fix (the screenshot helper that let the frame be collected while
# Skia encoded it, and the document opening that a second request could race); "fixed" is the branch as it is.
# The QR probes measure how often a random invitation fails to decode, which the fixed test data no longer shows.
on:
  push:
    branches: ['agent/runtime-stability']

permissions:
  contents: write

concurrency:
  group: ide-investigation-${{ github.sha }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  before-after:
    name: Before and after (${{ matrix.variant }})
    if: contains(github.event.head_commit.message, '[ide]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [unfixed, fixed]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Put back the code before the fixes
        if: matrix.variant == 'unfixed'
        run: |
          sed -i 's/using var frame = window.CaptureRenderedFrame()/var frame = window.CaptureRenderedFrame()/' tests/TabStudio.App.Tests/UiTestHelpers.cs
          git show 0c5fff9655787421633d0410697458eecab54663:src/TabStudio.App/ViewModels/WorkspaceViewModel.Documents.cs > src/TabStudio.App/ViewModels/WorkspaceViewModel.Documents.cs
          git diff --stat

      - name: Build the IDE tests
        run: |
          mkdir -p ci-out
          dotnet build tests/TabStudio.App.Tests -c Release > ci-out/build.log 2>&1 || { tail -n 40 ci-out/build.log; exit 1; }
          grep -E ': warning ' ci-out/build.log | sort -u > ci-out/warnings.txt || true
          echo "$(wc -l < ci-out/warnings.txt) distinct warnings"

      - name: Run each test five times
        run: |
          set +e
          for test in ScreenshotLifetimeTests A_file_opened_again_while_it_opens_gets_one_tab; do
            for run in 1 2 3 4 5 6; do
              # Runs 5 and 6 compile everything optimized from the start, as code that has run often is.
              tiering=1
              [ "$run" -ge 5 ] && tiering=0
              DOTNET_TieredCompilation=$tiering dotnet test tests/TabStudio.App.Tests -c Release --no-build --filter "FullyQualifiedName~$test" > "ci-out/$test-$run.log" 2>&1
              status=$?
              verdict=passed
              grep -q 'Test host process crashed\|The active test run was aborted' "ci-out/$test-$run.log" && verdict="TEST HOST CRASHED"
              [ "$status" -ne 0 ] && [ "$verdict" = passed ] && verdict="failed: $(grep -m 1 -A 2 'Error Message' "ci-out/$test-$run.log" | tail -n 1 | sed 's/^ *//')"
              echo "$test run $run (tiered compilation $tiering): $verdict" | tee -a ci-out/summary.txt
            done
          done
          { echo "### ${{ matrix.variant }}"; echo '```'; cat ci-out/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/ci/publish-logs.sh ide-investigation-${{ matrix.variant }} ${{ job.status }}

  qr-probe:
    name: QR codes of random invitations
    if: contains(github.event.head_commit.message, '[qr]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Add the probes
        run: |
          mkdir -p ci-out
          sed -i 's/private static byte\[\] Frame(/internal static byte[] Frame(/; s/private const int /internal const int /' tests/TabStudio.App.Tests/Platform/QrFrameDecoderTests.cs
          cat > tests/TabStudio.Link.Tests/QrRateProbe.cs <<'CS'
          using System.Diagnostics;
          using System.Security.Cryptography;
          using TabStudio.Link.Qr;
          using TabStudio.Link.Security;
          using ZXing;
          using ZXing.Common;
          using ZXing.Multi.QrCode;
          using ZXing.QrCode;
          using ZXing.QrCode.Internal;

          namespace TabStudio.Link.Tests;

          public sealed class QrRateProbe
          {
              [Fact]
              public void Measure()
              {
                  const int count = 3000;
                  int single = 0, singleHarder = 0, withFallback = 0, theirsSingle = 0, theirsFallback = 0;
                  var lines = new List<string>();
                  for (var n = 0; n < count; n++)
                  {
                      var fingerprint = LinkFingerprint.FromPublicKey(RandomNumberGenerator.GetBytes(91));
                      var text = new LinkInvitation("Yahav's Pixel 9 Pro", ["192.168.1.23", "10.0.0.5"], 47811, fingerprint, LinkPairingCode.Create()).ToUri();
                      var code = QrCode.Encode(text);
                      Func<int, int, bool> ours = (x, y) => code[x, y];
                      var reference = Encoder.encode(text, ErrorCorrectionLevel.M);
                      Func<int, int, bool> theirs = (x, y) => reference.Matrix[x, y] == 1;
                      if (Decode(ours, code.Size, false, false) != text) single++;
                      if (Decode(ours, code.Size, true, false) != text) singleHarder++;
                      if (Decode(ours, code.Size, false, true) != text) { withFallback++; if (lines.Count < 10) lines.Add("  still fails: " + text); }
                      if (Decode(theirs, reference.Matrix.Width, false, false) != text) theirsSingle++;
                      if (Decode(theirs, reference.Matrix.Width, false, true) != text) theirsFallback++;
                  }

                  File.WriteAllLines(Environment.GetEnvironmentVariable("QR_PROBE_OUT")!, [
                      $"Clean codes at 4 px a module, {count} random invitations, not read:",
                      $"  TabStudio's codes: QR reader {single}, with TRY_HARDER {singleHarder}, QR reader then multiple-code reader {withFallback}",
                      $"  ZXing's own codes for the same texts: QR reader {theirsSingle}, then multiple-code reader {theirsFallback}",
                      .. lines]);
              }

              private static string? Decode(Func<int, int, bool> dark, int modules, bool harder, bool fallback)
              {
                  const int scale = 4;
                  const int quiet = 4;
                  var size = (modules + (2 * quiet)) * scale;
                  var pixels = new byte[size * size];
                  Array.Fill(pixels, (byte)255);
                  for (var y = 0; y < modules; y++)
                  {
                      for (var x = 0; x < modules; x++)
                      {
                          if (!dark(x, y))
                          {
                              continue;
                          }

                          for (var dy = 0; dy < scale; dy++)
                          {
                              for (var dx = 0; dx < scale; dx++)
                              {
                                  pixels[((((y + quiet) * scale) + dy) * size) + ((x + quiet) * scale) + dx] = 0;
                              }
                          }
                      }
                  }

                  var source = new RGBLuminanceSource(pixels, size, size, RGBLuminanceSource.BitmapFormat.Gray8);
                  var hints = new Dictionary<DecodeHintType, object> { [DecodeHintType.CHARACTER_SET] = "UTF-8" };
                  if (harder)
                  {
                      hints[DecodeHintType.TRY_HARDER] = true;
                  }

                  var bitmap = new BinaryBitmap(new HybridBinarizer(source));
                  return new QRCodeReader().decode(bitmap, hints)?.Text
                      ?? (fallback ? new QRCodeMultiReader().decodeMultiple(bitmap, hints)?.FirstOrDefault()?.Text : null);
              }
          }
          CS
          cat > tests/TabStudio.App.Tests/Platform/QrRateProbe.cs <<'CS'
          using System.Diagnostics;
          using System.Security.Cryptography;
          using TabStudio.App.Platform;
          using TabStudio.Link.Qr;
          using TabStudio.Link.Security;
          using ZXing;
          using ZXing.Common;
          using ZXing.QrCode;

          namespace TabStudio.App.Tests.Platform;

          public sealed class QrRateProbe
          {
              [Fact]
              public void Measure()
              {
                  const int count = 600;
                  var before = new int[4];
                  var after = new int[4];
                  var lines = new List<string>();
                  for (var n = 0; n < count; n++)
                  {
                      var fingerprint = LinkFingerprint.FromPublicKey(RandomNumberGenerator.GetBytes(91));
                      var invitation = new LinkInvitation("Pixel 9", ["192.168.1.23", "10.0.0.7"], 50517, fingerprint, LinkPairingCode.Create()).ToUri();
                      var code = QrCode.Encode(invitation);
                      for (var r = 0; r < 4; r++)
                      {
                          var frame = QrFrameDecoderTests.Frame(code, r * 90, seed: n + (r * 90));
                          if (SingleReader(frame) != invitation)
                          {
                              before[r]++;
                          }

                          if (QrFrameDecoder.Decode(frame, QrFrameDecoderTests.RowStride, QrFrameDecoderTests.Width, QrFrameDecoderTests.Height) != invitation)
                          {
                              after[r]++;
                              if (lines.Count < 10)
                              {
                                  lines.Add($"  still fails at {r * 90} degrees, seed {n + (r * 90)}: {invitation}");
                              }
                          }
                      }
                  }

                  // The cost on frames without a code, where both readers run.
                  var empty = QrFrameDecoderTests.Frame(null, 0, seed: 7);
                  var clock = Stopwatch.StartNew();
                  for (var i = 0; i < 50; i++)
                  {
                      _ = SingleReader(empty);
                  }

                  var singleMs = clock.Elapsed.TotalMilliseconds / 50;
                  clock.Restart();
                  for (var i = 0; i < 50; i++)
                  {
                      _ = QrFrameDecoder.Decode(empty, QrFrameDecoderTests.RowStride, QrFrameDecoderTests.Width, QrFrameDecoderTests.Height);
                  }

                  var bothMs = clock.Elapsed.TotalMilliseconds / 50;
                  File.WriteAllLines(Environment.GetEnvironmentVariable("QR_PROBE_OUT")!, [
                      $"Camera frames, {count} random invitations, not read at 0/90/180/270 degrees:",
                      $"  QR reader alone: {string.Join("/", before)}",
                      $"  QrFrameDecoder (QR reader, then the multiple-code reader): {string.Join("/", after)}",
                      $"A frame without a code: {singleMs:0.0} ms with the QR reader alone, {bothMs:0.0} ms with both",
                      .. lines]);
              }

              private static string? SingleReader(byte[] frame)
              {
                  var source = new PlanarYUVLuminanceSource(frame, QrFrameDecoderTests.RowStride, QrFrameDecoderTests.Height, 0, 0, QrFrameDecoderTests.Width, QrFrameDecoderTests.Height, false);
                  var hints = new Dictionary<DecodeHintType, object> { [DecodeHintType.CHARACTER_SET] = "UTF-8", [DecodeHintType.TRY_HARDER] = true };
                  return new QRCodeReader().decode(new BinaryBitmap(new HybridBinarizer(source)), hints)?.Text;
              }
          }
          CS

      - name: Measure
        run: |
          QR_PROBE_OUT="$PWD/ci-out/qr-link.txt" dotnet test tests/TabStudio.Link.Tests -c Release --filter "FullyQualifiedName~QrRateProbe|FullyQualifiedName~QrCodeTests" > ci-out/link.log 2>&1 || tail -n 30 ci-out/link.log
          QR_PROBE_OUT="$PWD/ci-out/qr-app.txt" dotnet test tests/TabStudio.App.Tests -c Release --filter "FullyQualifiedName~QrRateProbe|FullyQualifiedName~QrFrameDecoderTests" > ci-out/app.log 2>&1 || tail -n 30 ci-out/app.log
          grep -E 'Passed!|Failed!|Total tests' ci-out/link.log ci-out/app.log || true
          { echo '```'; cat ci-out/qr-link.txt ci-out/qr-app.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat ci-out/qr-link.txt ci-out/qr-app.txt

      - name: Publish logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/ci/publish-logs.sh ide-investigation-qr ${{ job.status }}
