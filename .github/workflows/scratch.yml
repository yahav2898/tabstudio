name: Scratch build

# Development-only fast feedback for agent work: builds and runs the commands in build/scratch-commands.sh.
# Lives only on scratch/** branches, never on agent/** or main.
on:
  push:
    branches: ['scratch/**']

permissions:
  contents: write

concurrency:
  group: scratch-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  DOTNET_MODIFIABLE_ASSEMBLIES: debug

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-app-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-app-
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run scratch commands
        env:
          TABSTUDIO_SCREENSHOTS: ${{ github.workspace }}/ci-out/screenshots
        run: |
          mkdir -p ci-out/screenshots
          bash build/scratch-commands.sh > ci-out/run.log 2>&1 && echo PASS > ci-out/RESULT || echo FAIL > ci-out/RESULT
          tail -n 60 ci-out/run.log
      - name: Publish logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/ci/publish-logs.sh quick ${{ job.status }}
