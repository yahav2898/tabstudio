name: Android runtime latency

on:
  push:
    branches: ['agent/integrate-015']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-runtime-latency-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  paired-runtime:
    name: Compare interpreter and production JIT on one emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android

      - name: Build both signed x64 APKs from this source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-out/apks ci-out/build
          for variant in baseline jit; do
            interpreter=false
            [ "$variant" != baseline ] || interpreter=true
            actual="$(dotnet msbuild src/TabStudio.Android/TabStudio.Android.csproj -nologo -p:Configuration=Release -p:TabStudioInterpreterBenchmark="$interpreter" -getProperty:AndroidUseInterpreter)"
            printf '%s\n' "$actual" > "ci-out/build/$variant-runtime-property.txt"
            test "$actual" = "$interpreter"
            # Keep the first APK outside the Android output tree before cleaning configuration-dependent files.
            rm -rf src/TabStudio.Android/bin/Release src/TabStudio.Android/obj/Release
            status=0
            dotnet publish src/TabStudio.Android -c Release -f net10.0-android \
              -p:TreatWarningsAsErrors=true -p:TabStudioRuntimeIdentifiers=android-x64 \
              -p:TabStudioInterpreterBenchmark="$interpreter" -p:SourceRevisionId="$GITHUB_SHA" \
              -p:TabStudioBuildNumber=$(( ($(date +%s) - 1767225600) / 60 )) \
              -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" \
              > "ci-out/build/$variant.log" 2>&1 || status=$?
            tail -n 30 "ci-out/build/$variant.log"
            [ "$status" -eq 0 ] || exit "$status"
            apk="$(find src/TabStudio.Android/bin/Release/net10.0-android/publish -name '*-Signed.apk' -print -quit)"
            test -n "$apk"
            cp "$apk" "ci-out/apks/$variant.apk"
            sha256sum "ci-out/apks/$variant.apk" >> ci-out/build/apk-sha256.txt
          done

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Measure baseline then production on the same emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_c
          cores: 3
          ram-size: 4096M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash build/ci/android-runtime-benchmark.sh ci-out/apks/baseline.apk ci-out/apks/jit.apk ci-out

      - name: Validate and summarize measured latency
        if: always()
        shell: bash
        run: python3 build/ci/android-runtime-benchmark-report.py ci-out --source-sha "$GITHUB_SHA"

      - name: Keep APKs out of the diagnostic artifact
        if: always()
        shell: bash
        run: rm -f ci-out/apks/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-runtime-latency
          path: ci-out/
          retention-days: 14
