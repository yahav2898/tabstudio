name: Containers probe
on:
  push:
    branches: ['probe/containers']
jobs:
  probe:
    strategy: { fail-fast: false, matrix: { runner: [ubuntu-24.04-arm, ubuntu-latest] } }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash build/ci/containers-proot.sh "$RUNNER_TEMP/proot"
      - run: bash build/probe/run.sh 2>&1
