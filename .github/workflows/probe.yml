name: probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Environment info
        run: |
          mkdir -p ci-out
          {
            echo "== dotnet --info"; dotnet --info
            echo "== workloads"; dotnet workload search android || true
            echo "== android sdk"; echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME" || true
            ls "$ANDROID_HOME/platforms" || true
            ls "$ANDROID_HOME/build-tools" || true
            echo "== java"; java -version 2>&1 || true
          } 2>&1 | tee ci-out/probe.log
      - name: Publish logs to ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/logs
          cp -r ci-out/. /tmp/logs/ 2>/dev/null || true
          echo "workflow=${{ github.workflow }} run=${{ github.run_id }} sha=${{ github.sha }} status=${{ job.status }}" > /tmp/logs/STATUS
          cd /tmp/logs
          git init -q
          git config user.name "ci"
          git config user.email "ci@localhost"
          git checkout -q -b ci-logs
          git add -A
          git commit -qm "logs ${{ github.workflow }} ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
