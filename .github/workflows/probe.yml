name: Language probe
on:
  push:
    branches: ['probe/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Alpine v3.24 package versions
        run: |
          for arch in x86_64 aarch64; do
            for repo in main community; do
              curl -fsSL "https://dl-cdn.alpinelinux.org/alpine/v3.24/$repo/$arch/APKINDEX.tar.gz" | tar -xzO APKINDEX > idx-$repo-$arch
            done
            cat idx-main-$arch idx-community-$arch > idx-$arch
            echo "== $arch"
            awk -v RS= '{p="";v="";for(i=1;i<=NF;i++){if($i~/^P:/)p=substr($i,3);if($i~/^V:/)v=substr($i,3)} print p, v}' idx-$arch \
              | grep -E '^(php8[3-5]|php8[3-5]-(pecl-xdebug|phar|openssl|mbstring|tokenizer|xml|dom|ctype|curl|pdo|pdo_sqlite|pdo_mysql|pdo_pgsql|fileinfo|session|zip|intl|bcmath|iconv|simplexml|xmlwriter|xmlreader|sodium|gd|sqlite3|pcntl|posix|opcache|cli)|composer|phpactor|kotlin|openjdk2[15]-jdk|lldb|lldb-dev|maven|gradle|swift.*|nodejs|npm) ' | sort
          done
      - name: GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for r in Kotlin/kotlin-lsp:kotlin-lsp/v263.7084.0 phpactor/phpactor:2026.10.07.0 xdebug/vscode-php-debug:v1.40.2 JetBrains/kotlin:v2.4.21 fwcd/kotlin-language-server:1.3.13 vapor/toolbox:latest; do
            repo=${r%%:*}; tag=${r#*:}
            echo "== $repo $tag"
            if [ "$tag" = latest ]; then gh api "repos/$repo/releases/latest" --jq '.tag_name, (.assets[] | "\(.name) \(.size) \(.browser_download_url) \(.digest)")' || true
            else gh api "repos/$repo/releases/tags/$tag" --jq '.body[0:1500], (.assets[] | "\(.name) \(.size) \(.browser_download_url) \(.digest)")' || true; fi
          done
      - name: Hash candidate downloads
        run: |
          set +e
          hash() { if curl -fsSL "$1" -o f; then echo "OK $(sha256sum f | cut -d' ' -f1) $(stat -c %s f) $1"; else echo "FAIL $1"; fi; rm -f f; }
          for a in aarch64 x86_64; do
            hash "https://download.swift.org/swift-6.4.1-release/ubuntu2404$( [ $a = aarch64 ] && echo -aarch64 )/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE-ubuntu24.04$( [ $a = aarch64 ] && echo -aarch64 ).tar.gz"
          done
          hash https://open-vsx.org/api/xdebug/php-debug/1.40.2/file/xdebug.php-debug-1.40.2.vsix
          hash https://github.com/phpactor/phpactor/releases/download/2026.10.07.0/phpactor.phar
          curl -fsSL https://open-vsx.org/api/xdebug/php-debug | head -c 600; echo
          curl -fsSL https://www.swift.org/api/v1/install/releases.json | head -c 400; echo
      - name: Pinned repositories exist
        run: |
          for r in laravel/laravel slimphp/Slim-Skeleton gothinkster/laravel-realworld-example-app ktorio/ktor-samples spring-guides/tut-spring-boot-kotlin apple/swift-argument-parser vapor/template symfony/skeleton; do
            echo "$r $(git ls-remote https://github.com/$r HEAD | cut -f1)"
          done
