name: Containers build probe
on:
  push:
    branches: ['probe/build-containers']
permissions:
  contents: write
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-containers-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-
      - name: Build
        run: |
          mkdir -p out; status=0
          for p in $(cat .probe-build 2>/dev/null || echo tests/TabStudio.Containers.Tests); do
            dotnet build "$p" -c Release -p:TreatWarningsAsErrors=true > "out/build-$(basename $p).log" 2>&1 || status=1
          done
          cat out/build-*.log | grep -E ': (error|warning) [A-Z]+[0-9]+' | sed -E 's|/home/runner/work/tabstudio/tabstudio/||; s| \[/home.*||' | sort -u > out/errors.txt || true
          echo "build=$status" > out/STATUS
      - name: PRoot
        if: always()
        run: bash build/ci/containers-proot.sh "$RUNNER_TEMP/proot" > out/proot.log 2>&1; grep '^TABSTUDIO' out/proot.log >> "$GITHUB_ENV"
      - name: Test
        if: always()
        run: |
          [ -f .probe-tests ] || echo "tests/TabStudio.Containers.Tests|" > .probe-tests
          while IFS='|' read -r project filter; do
            [ -z "$project" ] && continue; name=$(basename "$project")
            timeout 25m dotnet test "$project" -c Release --no-build --blame-hang-timeout 8m --blame-hang-dump-type none ${filter:+--filter "$filter"} --logger "console;verbosity=normal" > "out/test-$name.log" 2>&1 && echo "$name passed" >> out/STATUS || echo "$name FAILED" >> out/STATUS
            grep -E "^\s+(Failed|Passed|Skipped) |Error Message|Assert|Exception|Total tests|Passed!|Failed!|at TabStudio" "out/test-$name.log" | head -400 > "out/summary-$name.txt" || true
          done < .probe-tests
      - name: Publish
        if: always()
        run: |
          cp -r out "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out" && git init -q && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "build $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-results/build-containers
