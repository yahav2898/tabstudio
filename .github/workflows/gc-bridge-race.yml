name: GC bridge race reproduction

# INVESTIGATION, to be removed: runs the minimal reproduction in build/android/gc-bridge-race on emulators with the
# concurrent collector (expected to crash) and with the serial one (expected to survive).
on:
  push:
    branches: ['agent/runtime-stability']

permissions:
  contents: write

concurrency:
  group: gc-bridge-race-${{ github.sha }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  repro:
    name: GC bridge race (${{ matrix.collector }}, API ${{ matrix.api }})
    if: contains(github.event.head_commit.message, '[repro]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        collector: [concurrent, serial]
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-android

      - name: Build the reproduction
        run: |
          mkdir -p ci-out
          concurrent=true
          [ "${{ matrix.collector }}" = serial ] && concurrent=false
          dotnet publish build/android/gc-bridge-race -c Release -f net10.0-android -p:RuntimeIdentifiers=android-x64 \
            -p:AndroidEnableSGenConcurrent=$concurrent \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" > ci-out/build.log 2>&1 || { tail -n 60 ci-out/build.log; exit 1; }
          tail -n 5 ci-out/build.log
          cp "$(find build/android/gc-bridge-race/bin/Release/net10.0-android/publish -name '*-Signed.apk' | head -n 1)" repro.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run it for up to ten minutes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_c
          cores: 3
          ram-size: 4096M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash build/android/gc-bridge-race/run.sh repro.apk ci-out 600

      - name: Publish logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/ci/publish-logs.sh gc-bridge-race-${{ matrix.collector }}-${{ matrix.api }} ${{ job.status }}
