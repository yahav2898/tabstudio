name: Flutter SDK verification (manual spike gate)

# Kept manual while the SDK bootstrap security review and Android PRoot spike remain open.
# This workflow does not imply the optional SDK checks ran in normal CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk:
    name: Flutter SDK (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install pinned Flutter and fetch a web project's packages
        run: bash build/ci/flutter-sdk-test.sh "$RUNNER_TEMP/flutter-sdk"
      - name: Run real Dart protocol and Flutter preview tests
        env:
          TABSTUDIO_FLUTTER_TESTS: '1'
          DART_SUPPRESS_ANALYTICS: 'true'
          TABSTUDIO_SCREENSHOTS: ${{ github.workspace }}/ci-out/flutter/screenshots
        run: |
          mkdir -p ci-out/flutter/screenshots
          dotnet test tests/TabStudio.LanguageServers.Tests -c Release --filter 'FullyQualifiedName~RealDartDebugTests|FullyQualifiedName~Dart_reports_diagnostics' --logger 'console;verbosity=normal'
          dotnet test tests/TabStudio.App.Tests -c Release --filter 'FullyQualifiedName~Toolchains.Flutter' --logger 'console;verbosity=normal'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-${{ matrix.runner }}
          path: ci-out/flutter
