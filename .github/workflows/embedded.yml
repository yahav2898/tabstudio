name: Embedded firmware

on:
  push:
    branches: [main, agent/embedded-universal, agent/real-use-fixes]
    paths:
      - 'src/TabStudio.Toolchains/**'
      - 'src/TabStudio.LanguageServers/**'
      - 'src/TabStudio.App/**'
      - 'src/TabStudio.Android/**'
      - 'tests/TabStudio.Toolchains.Tests/**'
      - 'tests/TabStudio.LanguageServers.Tests/**'
      - 'tests/TabStudio.App.Tests/**/*Embedded*'
      - 'docs/features/embedded.md'
      - 'docs/releases/0.19.0.md'
      - 'native/embedded/**'
      - 'build/android/native/**'
      - 'build/embedded/**'
      - 'build/pic/spike.py'
      - 'build/ci/real-repos.json'
      - '.github/workflows/embedded.yml'
  pull_request:
    paths:
      - 'src/TabStudio.Toolchains/**'
      - 'src/TabStudio.LanguageServers/**'
      - 'src/TabStudio.App/**'
      - 'src/TabStudio.Android/**'
      - 'tests/TabStudio.Toolchains.Tests/**'
      - 'tests/TabStudio.LanguageServers.Tests/**'
      - 'tests/TabStudio.App.Tests/**/*Embedded*'
      - 'docs/features/embedded.md'
      - 'docs/releases/0.19.0.md'
      - 'native/embedded/**'
      - 'build/android/native/**'
      - 'build/embedded/**'
      - 'build/pic/spike.py'
      - 'build/ci/real-repos.json'
      - '.github/workflows/embedded.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: embedded-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alpine-tools:
    name: Native Alpine embedded tools (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Signed compilers, verified Python wheels, Arduino archives and native bridges
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work alpine:3.24 \
            sh -ec 'apk add --no-cache python3 py3-pip ca-certificates build-base libusb-dev hidapi-dev openocd gcc-arm-none-eabi gcc-riscv-none-elf gcc-avr avr-libc binutils-arm-none-eabi binutils-riscv-none-elf gdb-multiarch && python3 build/embedded/alpine-smoke.py && python3 build/embedded/hidapi-check.py' \
            2>&1 | tee embedded-alpine.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-alpine-${{ matrix.runner }}-${{ github.event_name }}
          path: embedded-alpine.log

  contracts:
    name: Embedded parsers and USB bridge contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Native bridge and manifest tests (virtual devices only)
        run: |
          set -o pipefail
          mkdir -p ci-out/embedded-unit
          python3 -m unittest discover -s build/embedded/tests -p 'test_*.py' -v 2>&1 | tee ci-out/embedded-unit/native-tests.log
      - name: Install signed native PRoot build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libtalloc-dev gawk mtools
      - name: Raw USB syscalls through the APK's patched PRoot (synthetic FD)
        run: bash build/embedded/build-proot-test.sh "$RUNNER_TEMP/embedded-proot"
      - name: Compile stock nusb with its normal raw-syscall backend
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          CARGO_TARGET_DIR="$RUNNER_TEMP/nusb-check" cargo +1.85.1 build --locked --manifest-path build/embedded/nusb-check/Cargo.toml
      - name: Enumerate the actual permissioned inventory through stock nusb and patched PRoot
        run: dotnet run --project build/embedded/nusb-inventory-check -- "$TABSTUDIO_TEST_PROOT" "$RUNNER_TEMP/nusb-check/debug/tabstudio-nusb-check" "$RUNNER_TEMP/nusb-inventory"
      - name: Unchanged official wlink through the native WCH USB guard (synthetic kernel USB only)
        run: |
          set -o pipefail
          python3 build/embedded/wch-link-check/run.py --proot "$TABSTUDIO_TEST_PROOT" --work "$RUNNER_TEMP/wch-link-check" --output ci-out/embedded-unit/wch-link-check 2>&1 | tee ci-out/embedded-unit/wch-link-check.log
      - name: Embedded library and DAP unit tests
        run: |
          TABSTUDIO_FAT_PROOF="$RUNNER_TEMP/fat-proof" dotnet test tests/TabStudio.Toolchains.Tests --filter 'FullyQualifiedName~Embedded|FullyQualifiedName~ScopedPreloadProotTests|FullyQualifiedName~JavaProotTests' --logger 'trx;LogFileName=embedded-toolchains.trx' --results-directory ci-out/embedded-unit
          python3 build/embedded/verify-fat-images.py "$RUNNER_TEMP/fat-proof"
          dotnet test tests/TabStudio.LanguageServers.Tests --filter 'FullyQualifiedName~Embedded' --logger 'trx;LogFileName=embedded-dap.trx' --results-directory ci-out/embedded-unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-unit-${{ github.event_name }}
          path: ci-out/embedded-unit/
          if-no-files-found: error
      - name: Publish logs
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/ci/publish-logs.sh embedded-contracts ${{ job.status }}

  real-repositories:
    name: Real embedded repositories / ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [platformio-avr, arduino-liquidcrystal, stm32-cubemx, esp-idf, pico-sdk, zephyr, rust-embassy, arduino-servo, esp-idf-blink, marlin, zephyr-synchronization, arduino-neopixel, arduino-fastled, arduino-json, platformio-esp32, platformio-stm32cube, rust-stm32f4xx-hal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git cmake ninja-build build-essential python3-venv libusb-1.0-0 libffi-dev libssl-dev
      - name: Install Arm cross compiler from signed Ubuntu packages
        if: matrix.project == 'stm32-cubemx' || matrix.project == 'pico-sdk' || matrix.project == 'zephyr' || matrix.project == 'zephyr-synchronization'
        run: sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Install pinned build front ends
        if: matrix.project == 'platformio-avr' || matrix.project == 'marlin' || matrix.project == 'platformio-esp32' || matrix.project == 'platformio-stm32cube'
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r build/embedded/platformio.requirements.txt
      - name: Compile the pinned public repository with zero errors
        run: |
          python build/embedded/run-real-repos.py --only '${{ matrix.project }}' --work "$RUNNER_TEMP/embedded-repos" --output ci-out/embedded-repos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-repo-${{ matrix.project }}-${{ github.event_name }}
          path: ci-out/embedded-repos/
          if-no-files-found: error

  emulator-debugging:
    name: Cortex-M, RISC-V and AVR through the real DAP client
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install cross compilers, QEMU, simavr and GDB's real DAP adapter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi gcc-riscv64-unknown-elf gcc-avr avr-libc qemu-system-arm qemu-system-misc simavr gdb-multiarch gdb-source libgmp-dev libmpfr-dev python3-dev libexpat1-dev
      - name: Build an AVR GDB with real DAP support
        run: bash build/embedded/build-avr-gdb.sh "$RUNNER_TEMP/avr-gdb"
      - name: Build firmware, hit breakpoints, inspect locals and memory, and step
        env:
          TABSTUDIO_EMBEDDED_EMULATORS: '1'
          TABSTUDIO_REPO_ROOT: ${{ github.workspace }}
        run: dotnet test tests/TabStudio.LanguageServers.Tests --filter 'FullyQualifiedName~EmbeddedQemuTests' --logger 'trx;LogFileName=embedded-emulators.trx' --results-directory ci-out/embedded-emulators --verbosity normal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-emulators-${{ github.event_name }}
          path: ci-out/embedded-emulators/
          if-no-files-found: error

  glibc-frontends:
    name: Production glibc SDK installer / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install signed host prerequisites for the APK's pinned PRoot and Box64 builds
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libtalloc-dev gawk unzip cmake
          if [ "$(uname -m)" = aarch64 ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu gcc-x86-64-linux-gnu libc6-dev-amd64-cross
          fi
      - name: Install real SDK frontends, exercise glibc USB shims and compile Arduino firmware
        run: bash build/embedded/glibc-frontends.sh "$RUNNER_TEMP/embedded-glibc" ci-out/embedded-glibc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-glibc-${{ matrix.runner }}-${{ github.event_name }}
          path: ci-out/embedded-glibc/
          if-no-files-found: error

  box64-equivalence:
    name: Identical firmware from native x64 and ARM64 Box64 GCC
    needs: glibc-frontends
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: embedded-glibc-*-${{ github.event_name }}
          path: box64-evidence
      - name: Compare unchanged compiler identity and complete AVR ELF bytes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          roots = sorted(Path('box64-evidence').glob('*/box64-summary.json'))
          assert len(roots) == 2, roots
          records = [json.loads(p.read_text()) for p in roots]
          assert {r['architecture'] for r in records} == {'aarch64', 'x86_64'}, records
          assert all(r['childCount'] == 32 and r['inheritedFd'] == 3 and not r['hardwareVerified'] for r in records)
          assert records[0]['compilerSha256'] == records[1]['compilerSha256'], records
          assert roots[0].with_name('boxed-avr-firmware.elf').read_bytes() == roots[1].with_name('boxed-avr-firmware.elf').read_bytes()
          print('BOX64_NATIVE_FIRMWARE_BYTE_IDENTICAL child32 fd3 hardware=false')
          PY

  flash-clients:
    name: Native flashing clients (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Official pinned glibc clients and PATH wrappers
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libusb-1.0-0
          python3 build/embedded/flash-clients-smoke.py --mode binary 2>&1 | tee flash-clients-binary.log
      - name: Pinned native Alpine sources with dynamic USB backends
        shell: bash
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:3.24 sh -ec '
            apk add --no-cache python3 ca-certificates build-base libusb-dev libusb-compat-dev eudev-dev linux-headers pkgconf rust cargo gcc-riscv-none-elf newlib-riscv-none-elf binutils-riscv-none-elf &&
            failed=0
            for tool in embedded-bossac embedded-teensy embedded-wchisp embedded-mspdebug; do
              python3 build/embedded/flash-clients-smoke.py --mode source --tool "$tool" || failed=1
            done
            python3 build/embedded/ch32fun-smoke.py || failed=1
            python3 build/embedded/wlink-source-smoke.py || failed=1
            exit "$failed"
          ' 2>&1 | tee flash-clients-source.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flash-clients-${{ matrix.runner }}-${{ github.event_name }}
          path: flash-clients-*.log

  nordic-serial:
    name: Production Nordic serial DFU / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install signed host prerequisites for the APK's pinned native runtimes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libtalloc-dev gawk unzip cmake
          if [ "$(uname -m)" = aarch64 ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi
      - name: Install unchanged Nordic DFU and replay serial, USB serial and corrupt CRC through its public launcher
        run: bash build/embedded/glibc-frontends.sh "$RUNNER_TEMP/embedded-nordic" ci-out/embedded-nordic embedded-nrfutil
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-nordic-${{ matrix.runner }}-${{ github.event_name }}
          path: ci-out/embedded-nordic/
          if-no-files-found: error

  glibc-sdks:
    name: Production ${{ matrix.sdk }} SDK / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        sdk: [pico-sdk, zephyr, esp-idf, embedded-rust]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install signed host prerequisites for the APK's pinned PRoot build
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential libtalloc-dev gawk unzip
      - name: Install the production native SDK and compile a separate firmware project
        run: bash build/embedded/glibc-frontends.sh "$RUNNER_TEMP/embedded-sdk" ci-out/embedded-sdk '${{ matrix.sdk }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-sdk-${{ matrix.sdk }}-${{ matrix.runner }}-${{ github.event_name }}
          path: ci-out/embedded-sdk/
          if-no-files-found: error
