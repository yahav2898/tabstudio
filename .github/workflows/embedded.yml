name: Embedded firmware

on:
  push:
    branches: [main, agent/embedded-universal]
    paths:
      - 'src/TabStudio.Toolchains/**'
      - 'src/TabStudio.LanguageServers/**'
      - 'src/TabStudio.App/**'
      - 'src/TabStudio.Android/**'
      - 'tests/TabStudio.Toolchains.Tests/**'
      - 'tests/TabStudio.LanguageServers.Tests/**'
      - 'native/embedded/**'
      - 'build/android/native/**'
      - 'build/embedded/**'
      - 'build/pic/spike.py'
      - 'build/ci/real-repos.json'
      - '.github/workflows/embedded.yml'
  pull_request:
    paths:
      - 'src/TabStudio.Toolchains/**'
      - 'src/TabStudio.LanguageServers/**'
      - 'src/TabStudio.App/**'
      - 'src/TabStudio.Android/**'
      - 'tests/TabStudio.Toolchains.Tests/**'
      - 'tests/TabStudio.LanguageServers.Tests/**'
      - 'native/embedded/**'
      - 'build/android/native/**'
      - 'build/embedded/**'
      - 'build/pic/spike.py'
      - 'build/ci/real-repos.json'
      - '.github/workflows/embedded.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: embedded-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alpine-tools:
    name: Native Alpine embedded tools (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Signed compilers, verified Python wheels, Arduino archives and native bridges
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work alpine:3.24 \
            sh -ec 'apk add --no-cache python3 py3-pip ca-certificates build-base libusb-dev gcc-arm-none-eabi gcc-riscv-none-elf gcc-avr avr-libc binutils-arm-none-eabi binutils-riscv-none-elf gdb-multiarch && python3 build/embedded/alpine-smoke.py' \
            2>&1 | tee embedded-alpine.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-alpine-${{ matrix.runner }}-${{ github.event_name }}
          path: embedded-alpine.log

  contracts:
    name: Embedded parsers and USB bridge contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Native bridge and manifest tests (virtual devices only)
        run: |
          mkdir -p ci-out/embedded-unit
          python3 -m unittest discover -s build/embedded/tests -p 'test_*.py' -v 2>&1 | tee ci-out/embedded-unit/native-tests.log
      - name: Install signed native PRoot build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libtalloc-dev gawk
      - name: Raw USB syscalls through the APK's patched PRoot (synthetic FD)
        run: bash build/embedded/build-proot-test.sh "$RUNNER_TEMP/embedded-proot"
      - name: Compile stock nusb with its normal raw-syscall backend
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          CARGO_TARGET_DIR="$RUNNER_TEMP/nusb-check" cargo +1.85.1 build --locked --manifest-path build/embedded/nusb-check/Cargo.toml
      - name: Enumerate the actual permissioned inventory through stock nusb and patched PRoot
        run: dotnet run --project build/embedded/nusb-inventory-check -- "$TABSTUDIO_TEST_PROOT" "$RUNNER_TEMP/nusb-check/debug/tabstudio-nusb-check" "$RUNNER_TEMP/nusb-inventory"
      - name: Embedded library and DAP unit tests
        run: |
          dotnet test tests/TabStudio.Toolchains.Tests --filter 'FullyQualifiedName~Embedded|FullyQualifiedName~ScopedPreloadProotTests|FullyQualifiedName~JavaProotTests' --logger 'trx;LogFileName=embedded-toolchains.trx' --results-directory ci-out/embedded-unit
          dotnet test tests/TabStudio.LanguageServers.Tests --filter 'FullyQualifiedName~Embedded' --logger 'trx;LogFileName=embedded-dap.trx' --results-directory ci-out/embedded-unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-unit-${{ github.event_name }}
          path: ci-out/embedded-unit/
          if-no-files-found: error

  real-repositories:
    name: Real embedded repositories / ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [platformio-avr, arduino-liquidcrystal, stm32-cubemx, esp-idf, pico-sdk, zephyr, rust-embassy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git cmake ninja-build build-essential python3-venv libusb-1.0-0 libffi-dev libssl-dev
      - name: Install Arm cross compiler from signed Ubuntu packages
        if: matrix.project == 'stm32-cubemx' || matrix.project == 'pico-sdk' || matrix.project == 'zephyr'
        run: sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Install pinned build front ends
        run: |
          python -m pip install 'platformio==6.1.18' 'west==1.3.0'
      - name: Compile the pinned public repository with zero errors
        run: |
          python build/embedded/run-real-repos.py --only '${{ matrix.project }}' --work "$RUNNER_TEMP/embedded-repos" --output ci-out/embedded-repos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-repo-${{ matrix.project }}-${{ github.event_name }}
          path: ci-out/embedded-repos/
          if-no-files-found: error

  emulator-debugging:
    name: Cortex-M, RISC-V and AVR through the real DAP client
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install cross compilers, QEMU, simavr and GDB's real DAP adapter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi gcc-riscv64-unknown-elf gcc-avr avr-libc qemu-system-arm qemu-system-misc simavr gdb-multiarch gdb-source libgmp-dev libmpfr-dev python3-dev libexpat1-dev
      - name: Build an AVR GDB with real DAP support
        run: bash build/embedded/build-avr-gdb.sh "$RUNNER_TEMP/avr-gdb"
      - name: Build firmware, hit breakpoints, inspect locals and memory, and step
        env:
          TABSTUDIO_EMBEDDED_EMULATORS: '1'
          TABSTUDIO_REPO_ROOT: ${{ github.workspace }}
        run: dotnet test tests/TabStudio.LanguageServers.Tests --filter 'FullyQualifiedName~EmbeddedQemuTests' --logger 'trx;LogFileName=embedded-emulators.trx' --results-directory ci-out/embedded-emulators --verbosity normal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-emulators-${{ github.event_name }}
          path: ci-out/embedded-emulators/
          if-no-files-found: error

  glibc-frontends:
    name: Production glibc SDK installer / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install signed host prerequisites for the APK's pinned PRoot build
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential libtalloc-dev gawk unzip
      - name: Install real SDK frontends, exercise glibc USB shims and compile Arduino firmware
        run: bash build/embedded/glibc-frontends.sh "$RUNNER_TEMP/embedded-glibc" ci-out/embedded-glibc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-glibc-${{ matrix.runner }}-${{ github.event_name }}
          path: ci-out/embedded-glibc/
          if-no-files-found: error
