name: Microchip PIC

on:
  push:
    branches: [main]
    paths:
      - 'build/pic/**'
      - 'src/TabStudio.Toolchains/Microchip/**'
      - 'samples/PIC/**'
      - '.github/workflows/pic.yml'
  pull_request:
    paths:
      - 'build/pic/**'
      - 'src/TabStudio.Toolchains/Microchip/**'
      - 'samples/PIC/**'
      - '.github/workflows/pic.yml'

permissions:
  contents: read

concurrency:
  group: pic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  spike:
    name: ${{ matrix.compiler }} on ${{ matrix.runner }} (Alpine + PRoot)
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        compiler: [xc8, xc32]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install PRoot build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libtalloc-dev gawk build-essential cmake gcc-x86-64-linux-gnu
      - name: Test the harness without proprietary downloads
        run: python3 -m unittest discover -s build/pic -p 'test_*.py' -v
      - name: Run the official installer and compile the template three times
        run: |
          python3 build/pic/spike.py --compiler '${{ matrix.compiler }}' \
            --work "$RUNNER_TEMP/pic" --output ci-out/pic --accept-microchip-license
      - name: Publish measurements and our firmware (no compilers or packs)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pic-${{ matrix.compiler }}-${{ matrix.runner }}
          path: ci-out/pic/
          if-no-files-found: error

  native-fallback:
    name: Native ${{ matrix.tool }} feasibility (aarch64-musl)
    needs: spike
    if: ${{ always() && needs.spike.result == 'failure' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        tool: [xc32, sdcc]
    steps:
      - uses: actions/checkout@v4
      - name: Install PRoot build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libtalloc-dev gawk build-essential
      - name: Build a native compiler from verified source and emit a target object
        run: |
          python3 build/pic/native_spike.py --tool '${{ matrix.tool }}' \
            --work "$RUNNER_TEMP/pic-native" --output ci-out/pic-native
      - name: Publish source-build logs and the emitted object (no compiler distribution)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pic-native-${{ matrix.tool }}
          path: ci-out/pic-native/
          if-no-files-found: error

  report:
    name: Compare compiler measurements
    needs: [spike, native-fallback]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pic-*
          path: measurements
      - name: Compare ARM64 and x86-64
        run: |
          mkdir -p ci-out
          python3 build/pic/report.py measurements --output ci-out/PIC-compiler-spike.md
      - name: Add the measurements to the workflow summary
        if: always()
        run: cat ci-out/PIC-compiler-spike.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pic-spike-report
          path: ci-out/PIC-compiler-spike.md
          if-no-files-found: error
