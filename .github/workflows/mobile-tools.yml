name: Verify mobile tool downloads
on:
  push:
    branches: ['agent/mobile']
permissions:
  contents: read
jobs:
  pins:
    name: Verify mobile tool downloads
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Fetch release tools and inspect ARM binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir tools && cd tools
          for arch in aarch64 arm; do
            curl --fail --location --retry 3 -o "$arch.zip" "https://github.com/lzhiyong/android-sdk-tools/releases/download/35.0.2/android-sdk-tools-static-$arch.zip"
            sha256sum "$arch.zip"
            unzip -q "$arch.zip" -d "$arch"
            file "$arch"/build-tools/{aapt2,zipalign}
          done
          chmod +x aarch64/build-tools/*
          aarch64/build-tools/aapt2 version
          curl --fail --location --retry 3 -O https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          curl --fail --location --retry 3 -O https://dl.google.com/android/repository/platform-35_r02.zip
          curl --fail --location --retry 3 -O https://dl.google.com/android/repository/build-tools_r35_linux.zip
          curl --fail --location --retry 3 -O https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sha256sum *.zip
