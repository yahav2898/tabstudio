name: GC stress

# Runs the emulator self test again and again on builds whose Mono garbage collector checks its own heap, to catch
# the rare garbage-collector aborts that a single CI run hits about once in a hundred:
# - concurrent: the collector release builds use (build/android/gc-stress/concurrent.env);
# - serial: the collector without its concurrent mark, verifying every reference after each major collection
#   (build/android/gc-stress/serial.env).
# Each build runs on Android 10 (API 29) and Android 15 (API 35) emulators, two of each. It takes about half an hour
# on ten runners, too much for every push, so it runs:
# - every night on main;
# - by hand: Actions > GC stress > Run workflow, or `gh workflow run gc-stress.yml --ref <branch> -f runs=4`;
# - on a push to main or an agent branch whose commit message contains [gc-stress].
#
# Each emulator's results are in the ci-logs branch under gc-stress-<build>-<api>-<shard>/ (branches/<branch>/...
# for a branch): summary.txt has a line per run; run-<n>/ has the run's verdict, screenshots and the collector's
# log (gc.txt), and for a run that crashed, crash.txt with Mono's message and the native backtrace.

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: Self-test runs on each emulator
        default: '4'
  push:
    branches: [main, 'agent/**']

permissions:
  contents: write

concurrency:
  group: gc-stress-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: Build the GC stress APK (${{ matrix.build }})
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[gc-stress]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build: [concurrent, serial]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-android

      - uses: actions/cache@v4
        with:
          path: artifacts/native
          key: android-native-${{ hashFiles('build/android/native/build.sh') }}-x64

      - name: Build the toolchain runtime
        run: |
          mkdir -p ci-out
          bash build/android/native/build.sh artifacts/native x86_64 2>&1 | tee ci-out/native-build.log
          exit "${PIPESTATUS[0]}"

      - name: Build an x86_64 APK that checks its heap
        run: |
          mkdir -p ci-out
          status=0
          dotnet publish src/TabStudio.Android -c Release -f net10.0-android -p:TabStudioRuntimeIdentifiers=android-x64 \
            -p:TabStudioAndroidEnvironment=build/android/gc-stress/${{ matrix.build }}.env \
            -p:TabStudioBuildNumber=$(( ($(date +%s) - 1767225600) / 60 )) \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" \
            > ci-out/android-x64-build.log 2>&1 || status=$?
          tail -n 40 ci-out/android-x64-build.log
          [ "$status" -eq 0 ] || exit $status
          cp "$(find src/TabStudio.Android/bin/Release/net10.0-android/publish -name '*-Signed.apk' | head -n 1)" TabStudio-x64-gc-stress.apk

      # Which Mono the APK carries and the environment its runtime starts with, so a crash can be matched to both.
      - name: Show the runtime
        run: |
          mkdir -p runtime && unzip -o -q TabStudio-x64-gc-stress.apk 'lib/x86_64/libmonosgen-2.0.so' -d runtime
          strings runtime/lib/x86_64/libmonosgen-2.0.so | grep -m 3 -E '^[0-9]+\.[0-9]+\.[0-9]+.*(\(|-)' | tee ci-out/runtime.txt || true
          grep -v '^#' build/android/gc-stress/${{ matrix.build }}.env | grep . | tee -a ci-out/runtime.txt

      - uses: actions/upload-artifact@v4
        with:
          name: gc-stress-apk-${{ matrix.build }}
          path: |
            TabStudio-x64-gc-stress.apk
            ci-out/runtime.txt
          retention-days: 3

      - name: Publish logs
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/ci/publish-logs.sh gc-stress-build-${{ matrix.build }} ${{ job.status }}

  emulator:
    name: Self test under GC checks (${{ matrix.build }}, API ${{ matrix.api }}, ${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        build: [concurrent, serial]
        api: [29, 35]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gc-stress-apk-${{ matrix.build }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the self test again and again
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GC_STRESS_TITLE: ${{ matrix.build }}, API ${{ matrix.api }}, shard ${{ matrix.shard }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_c
          cores: 3
          ram-size: 4096M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash build/ci/android-gc-stress.sh TabStudio-x64-gc-stress.apk ci-out ${{ inputs.runs || '4' }} 900

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gc-stress-${{ matrix.build }}-${{ matrix.api }}-${{ matrix.shard }}
          path: ci-out/
          if-no-files-found: ignore

      - name: Publish logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/ci/publish-logs.sh gc-stress-${{ matrix.build }}-${{ matrix.api }}-${{ matrix.shard }} ${{ job.status }}
