name: GC stress

# Runs the emulator self test again and again, to catch the rare garbage-collector aborts that a single CI run hits
# about once in a hundred. Three builds of the app:
# - release: exactly as shipped (Mono's mark-and-sweep collector, marking while the app is stopped);
# - checked: the same collector verifying every reference after each major collection
#   (build/android/gc-stress/checked.env);
# - concurrent: the concurrent collector TabStudio turned off, with its own checks
#   (build/android/gc-stress/concurrent.env). It reproduces the runtime race that made TabStudio abort, so it is
#   expected to fail until a .NET runtime fixes it; it runs only when asked for (builds input).
# Each build runs on Android 10 (API 29) and Android 15 (API 35) emulators, two of each. That is about half an hour
# on ten runners, too much for every push, so it runs:
# - every night on main;
# - by hand: Actions > GC stress > Run workflow, or
#   `gh workflow run gc-stress.yml --ref <branch> -f runs=4 -f builds='["release","checked","concurrent"]'`;
# - on a push to main or an agent branch whose commit message contains [gc-stress].
# A run fails when the app crashes. The self test's own verdict is reported but does not fail it: the emulator job
# in ci.yml checks that.
#
# Each emulator's results are in the ci-logs branch under gc-stress-<build>-<api>-<shard>/ (branches/<branch>/...
# for a branch): summary.txt has a line per run; run-<n>/ has the run's verdict, screenshots and the collector's
# log (gc.txt), and for a run that crashed, crash.txt with Mono's message and the native backtrace, the full
# tombstone, and symbolized/ with the runtime's functions named.

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: Self-test runs on each emulator
        default: '4'
      builds:
        description: Builds to test, a JSON list of release, checked and concurrent
        default: '["release","checked"]'
  push:
    branches: [main, 'agent/**']

permissions:
  contents: write

concurrency:
  group: gc-stress-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: Build the GC stress APK (${{ matrix.build }})
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[gc-stress]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(inputs.builds || '["release","checked","concurrent"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-android

      - uses: actions/cache@v4
        with:
          path: artifacts/native
          key: android-native-${{ hashFiles('build/android/native/build.sh') }}-x64

      - name: Build the toolchain runtime
        run: |
          mkdir -p ci-out
          bash build/android/native/build.sh artifacts/native x86_64 2>&1 | tee ci-out/native-build.log
          exit "${PIPESTATUS[0]}"

      - name: Build the x86_64 APK
        run: |
          mkdir -p ci-out
          status=0
          environment=""
          [ "${{ matrix.build }}" = release ] || environment="-p:TabStudioAndroidEnvironment=build/android/gc-stress/${{ matrix.build }}.env"
          dotnet publish src/TabStudio.Android -c Release -f net10.0-android -p:TabStudioRuntimeIdentifiers=android-x64 \
            $environment \
            -p:TabStudioBuildNumber=$(( ($(date +%s) - 1767225600) / 60 )) \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" \
            > ci-out/android-x64-build.log 2>&1 || status=$?
          tail -n 40 ci-out/android-x64-build.log
          [ "$status" -eq 0 ] || exit $status
          cp "$(find src/TabStudio.Android/bin/Release/net10.0-android/publish -name '*-Signed.apk' | head -n 1)" TabStudio-x64-gc-stress.apk

      # Which Mono the APK carries and the environment its runtime starts with, so a crash can be matched to both.
      - name: Show the runtime
        run: |
          mkdir -p runtime && unzip -o -q TabStudio-x64-gc-stress.apk 'lib/x86_64/libmonosgen-2.0.so' -d runtime
          strings runtime/lib/x86_64/libmonosgen-2.0.so | grep -m 1 '@Commit' | sed 's/^/Mono /' | tee ci-out/runtime.txt || true
          readelf -n runtime/lib/x86_64/libmonosgen-2.0.so | grep 'Build ID' | sed 's/^ */libmonosgen-2.0.so /' | tee -a ci-out/runtime.txt
          if [ "${{ matrix.build }}" = release ]; then
            echo "No extra environment: the collector as shipped." | tee -a ci-out/runtime.txt
          else
            grep -v '^#' build/android/gc-stress/${{ matrix.build }}.env | grep . | tee -a ci-out/runtime.txt
          fi

      # INVESTIGATION, to be removed: the SGen worker's crash in the regular emulator job on aa280c05.
      - name: Name the functions of an earlier crash
        if: matrix.build == 'release'
        run: |
          for pc in 2f0fb2 302066 2e90b0 2de1f6 31244f; do
            echo "      #0$((n++)) pc 0000000000$pc  /data/app/x/lib/x86_64/libmonosgen-2.0.so (BuildId: 5da5c145fc7fa7ce8afbbdad2d3fa1638294a919)"
          done > earlier-crash.txt
          bash build/ci/android-symbolize.sh TabStudio-x64-gc-stress.apk x86_64 ci-out/earlier earlier-crash.txt
          mkdir -p runtime && objdump -d --start-address=0x2f0f40 --stop-address=0x2f0fd0 runtime/lib/x86_64/libmonosgen-2.0.so | tail -n 40 > ci-out/earlier/disassembly.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: gc-stress-apk-${{ matrix.build }}
          path: |
            TabStudio-x64-gc-stress.apk
            ci-out/runtime.txt
            ci-out/earlier/
          retention-days: 3

      - name: Publish logs
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/ci/publish-logs.sh gc-stress-build-${{ matrix.build }} ${{ job.status }}

  emulator:
    name: Self test under GC stress (${{ matrix.build }}, API ${{ matrix.api }}, ${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(inputs.builds || '["release","checked","concurrent"]') }}
        api: [29, 35]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gc-stress-apk-${{ matrix.build }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the self test again and again
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GC_STRESS_TITLE: ${{ matrix.build }}, API ${{ matrix.api }}, shard ${{ matrix.shard }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_c
          cores: 3
          ram-size: 4096M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash build/ci/android-gc-stress.sh TabStudio-x64-gc-stress.apk ci-out ${{ inputs.runs || '4' }} 900

      - uses: actions/setup-dotnet@v4
        if: always()
        with:
          global-json-file: global.json

      # The runtime's libraries are stripped; their symbols, from Microsoft's symbol server, name the functions.
      - name: Name the functions in the crashes' backtraces
        if: always()
        run: |
          crashes="$(find ci-out -name crash.txt -o -name 'tombstone_*.txt' | sort)"
          [ -n "$crashes" ] || { echo "No crashes."; exit 0; }
          bash build/ci/android-symbolize.sh TabStudio-x64-gc-stress.apk x86_64 ci-out/symbolized $crashes

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gc-stress-${{ matrix.build }}-${{ matrix.api }}-${{ matrix.shard }}
          path: ci-out/
          if-no-files-found: ignore

      - name: Publish logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash build/ci/publish-logs.sh gc-stress-${{ matrix.build }}-${{ matrix.api }}-${{ matrix.shard }} ${{ job.status }}
