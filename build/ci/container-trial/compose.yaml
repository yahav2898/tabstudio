services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tablet
      POSTGRES_PASSWORD: development
      POSTGRES_DB: realworld
    ports: ['0:5432']
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'tablet']
      interval: 1s
      retries: 60
  app:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://tablet:development@db:5432/realworld?schema=public
      JWT_SECRET: container-trial-only
